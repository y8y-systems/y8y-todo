<script>
/* darklight pre-paint — y8y 共享主题引擎引导
   唯一文本源: /var/lib/todolist-legacy/bin/darklight-prepaint.html (改动请改这里, 再跑 darklight-sync.py)
   为什么必须 inline: 要在任何 CSS 生效前定下 data-theme, 否则首屏闪白。
   此处只做「读模式 → 上色」; 三态决策/系统监听/按钮高亮全在 /assets/darklight.js */
(function () {
  var K = 'y8y-theme-mode', LEGACY = ['theme', 'y8yshop-theme'], m = null, i = 0;
  try {
    for (; i < LEGACY.length; i++) if (localStorage.getItem(LEGACY[i]) !== null) localStorage.removeItem(LEGACY[i]);
    m = localStorage.getItem(K);
  } catch (e) {}
  if (m !== 'light' && m !== 'dark') m = 'auto';
  var r = (m === 'auto')
    ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
    : m;
  document.documentElement.setAttribute('data-y8y-theme-mode', m);
  document.documentElement.setAttribute('data-theme', r);
})();
</script>

/* ⚠️ 2026-09-23 修：原为 `<style>font-face {` —— 少了 `@`，于是整条规则被当成
   标签选择器 "font-face"（无匹配元素），@font-face **从未生效** ⇒ 界面字体一直回落到
   系统 monospace（实测 Zpix 与 monospace 渲染宽度完全相同）。**
   `src: url('zpix.woff2')` 是相对文档的路径（/zpix.woff2，实测 200），本身没错。 */
/* 2026-09-23 定案：字体全站统一共享 —— 本站 @font-face 已移除。
   Zpix 现由共享 assets/tokens.css 提供（物理文件 /var/lib/todolist-legacy/shared/chrome/fonts/zpix.woff2，
   经各 origin 的 /assets/fonts/ 路由）。本地 woff2 保留在盘上作回退，但不再被引用。 */

/* ── Design Tokens — y8y v2.0.0 ── */
/* light is default (page loads in light first; initTheme may flip before paint) */
:root,
[data-theme="light"] {
  color-scheme: light;

  /* 1. neutral paper ramp */
  --bg-canvas: #f1eadb;
  --bg-section: #e7dfcf;
  --bg-surface: #fff8e8;
  --border-default: #b8ad99;
  --text-muted: #6d6f7d;
  --text-primary: #202534;

  /* 2. semantic (brand / danger / special / info / success)
     y8y v2.1.0 §2.2: accent 不再分 day/night，亮色原样复用 night 值。
     2026-09-22 先统一了 brand；2026-09-23 余下 4 个 day 变体（#A83F3C/#6751A7/#246E75/#336B3D）删除，完全对齐规范。 */
  --color-brand: #e8853d;
  --color-danger: #d8645a;
  --color-special: #8d78c9;
  --color-info: #54b8bc;
  --color-success: #68a36b;
  /* 自选颜色 (实验: 2026-08-11 想看暗色 night 值用在亮色模式的效果) */
  --c-orange: #e8853d;
  --c-cyan: #54b8bc;
  --c-purple: #8d78c9;
  --c-green: #68a36b;
  --c-red: #d8645a;
  --c-yellow: #c7a052;
  --c-blue: #5688ad;
  --c-pink: #e58ab0;

  /* 3. pixel depth */
  --shadow-pixel: #aaa08e;
  --highlight-pixel: #ffffff;

  /* 4. bookkeeping extensions (同 y8y v2.1.0：亮色复用 night 值) */
  --color-income: #54b8bc;
  --color-expense: #d9752f;

  /* 5. geometric tokens (from y8y §7) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --shadow-card: 6px;
  --shadow-control: 3px;
  --border-card: 3px;
  --border-control: 2px;

  --scanline: rgba(0,0,0,0.032);  /* 2026-08-12: 0.04 → 0.032 (基础 100% 再降约 20%) */
}

[data-theme="dark"] {
  color-scheme: dark;

  --bg-canvas: #0d1018;
  --bg-section: #131720;
  --bg-surface: #1c2130;
  --border-default: #3c455e;
  --text-muted: #8f96a8;
  --text-primary: #e4dcc4;

  --color-brand: #e8853d;
  --color-danger: #d8645a;
  --color-special: #8d78c9;
  --color-info: #54b8bc;
  --color-success: #68a36b;
  /* 自选颜色 (dark, data-8 night 值 + pink 用户扩展) */
  --c-orange: #e8853d;
  --c-cyan: #54b8bc;
  --c-purple: #8d78c9;
  --c-green: #68a36b;
  --c-red: #d8645a;
  --c-yellow: #c7a052;
  --c-blue: #5688ad;
  --c-pink: #e58ab0;

  --shadow-pixel: #080a10;
  --highlight-pixel: #283047;

  --color-income: #54b8bc;
  --color-expense: #d9752f;

  --scanline: rgba(255,255,255,0.02);
}

/* ── legacy alias mapping (clean migration: old var names → new ones) ── */
:root,
[data-theme="light"],
[data-theme="dark"] {
  --bg: var(--bg-canvas);
  --surface: var(--bg-surface);
  --surface2: var(--bg-section);
  --muted-bg: var(--bg-section);
  --border: var(--border-default);
  --text: var(--text-primary);
  --text2: var(--text-primary);
  --inv-text: var(--bg-surface);
  --accent: var(--color-brand);
  --accent2: var(--color-brand);
  --green: var(--color-success);
  --orange: var(--color-brand);
  --red: var(--color-danger);
  --teal: var(--color-info);
  --dim-text: var(--text-muted);
  --dim-border: var(--border-default);
  --card-border: 3px;
  --inner-border: 2px;
  --shadow-offset: 6px;
}

/* ── Reset ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
/* 注意: 不要用 height:100% 锁死 body (会让 sticky 子元素的包含块=视口高度,
   内容溢出时 sticky 行程被截断, filter-bar 吸顶失效, 2026-08-11 实测踩坑) */
body {
  font-family: 'Zpix', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  background: var(--bg-canvas);
  color: var(--text-primary);
  padding: 0 0 80px 0;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  image-rendering: pixelated;
  position: relative;
  transition: background 0.15s, color 0.15s;
}

/* CRT scanline overlay — y8y §7.5 */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    var(--scanline) 0px,
    var(--scanline) 1px,
    transparent 1px,
    transparent 4px
  );
}

/* brand integrity: any parent forcing uppercase cannot re-case the y8y mark */
.logo-accent { text-transform: none; }

/* ── Header ── (2026-09-11: 几何/品牌拆分/无下划线全部由共享 assets/header.css governs;
   视图 tab + 新建钮进 .header-right 右槽, 齿轮=独立设置钮 #settingsBtn; 下方仅保留 todo 专属 .count 徽标) ── */
/* 品牌 logo/文字 强制无下划线 (共享 header.css 之外的防御: 即便该 <link> 在 CF Access 路径未生效,
   也保证 logo 与标题在任何状态都不出现浏览器默认 <a> 下划线) */
.brand-img, .brand-img:hover, .brand-img:visited, .brand-img:active,
.brand-title, .brand-title:hover, .brand-title:visited, .brand-title:active,
.brand-img *, .brand-title * { text-decoration: none; }
.header .count {
  font-size: var(--fs-10);
  color: var(--text-muted);
  display: inline-block;
}

/* ── Theme Toggle ── */
.theme-toggle {
  width: 34px; height: 34px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 2px solid var(--border-default);
  cursor: pointer;
  font-size: var(--fs-14);
  font-family: 'Zpix', monospace;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 3px 3px 0 var(--shadow-pixel);
}
.theme-toggle:hover { background: var(--bg-section); }
.theme-toggle:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--shadow-pixel);
}
.theme-toggle:focus-visible {
  outline: 3px solid var(--color-brand);
  outline-offset: 3px;
}

/* ── Project Scope Switcher ── */
/* 项目+时间 filter 并排行 (2026-08-11; 2026-09-11 起不再 sticky, 随内容滚走) */
.filter-bar {
  position: relative; z-index: 99;   /* 2026-09-11: 不再 sticky(随内容滚走); relative 仍是定位锚, 项目/时间下拉菜单相对它定位不溢出 */
  display: flex; gap: 8px;
  background: var(--bg-section);
  padding: 8px 16px;
  border-bottom: 3px solid var(--border-default);
  box-shadow: inset 2px 2px 0 var(--highlight-pixel);
}
.filter-cell {
  flex: 1;
  min-width: 0;
  /* 2026-08-12: 移除 position:relative — 菜单改相对 filter-bar 定位, 防窄 cell 时溢出 */
}
.filter-cell .project-trigger {
  width: 100%;
  max-width: none;
  justify-content: space-between;
}
.project-switcher { position: relative; }
.time-switcher { position: relative; }
.project-trigger {
  height: 34px;
  max-width: 190px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 2px solid var(--border-default);
  box-shadow: 3px 3px 0 var(--shadow-pixel);
  cursor: pointer;
  font-family: 'Zpix', monospace;
  font-size: var(--fs-11);
}
.project-trigger:hover { background: var(--bg-section); }
.project-trigger:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--shadow-pixel);
}
.project-trigger:focus-visible,
.project-menu-item:focus-visible {
  outline: 3px solid var(--color-brand);
  outline-offset: 3px;
}
.project-trigger-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.project-caret { color: var(--color-info); flex-shrink: 0; }
.project-menu {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  left: 16px;                        /* 相对 filter-bar 左对齐展开, 窄 cell 也不溢出 (2026-08-12) */
  right: auto;
  width: min(300px, calc(100vw - 32px));
  max-height: min(420px, calc(100vh - 90px));
  overflow-y: auto;
  padding: 6px;
  background: var(--bg-surface);
  border: 3px solid var(--border-default);
  box-shadow: 6px 6px 0 var(--shadow-pixel);
  z-index: 250;
}
.project-menu.open { display: block; }
.project-menu-item {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 2px solid transparent;
  background: transparent;
  color: var(--text-primary);
  cursor: pointer;
  font-family: 'Zpix', monospace;
  font-size: var(--fs-11);
  text-align: left;
}
.project-menu-item:hover { background: var(--bg-section); }
.project-menu-item[aria-current="true"] {
  background: var(--bg-section);
  border-color: var(--color-info);
  color: var(--color-info);
}
.project-menu-item.create {
  color: var(--color-brand);
  border-color: var(--color-brand);
  margin-top: 6px;
}
.project-menu-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.project-menu-count { color: var(--text-muted); flex-shrink: 0; }
.project-menu-divider {
  border: 0;
  border-top: 2px solid var(--border-default);
  margin: 6px 4px;
}

/* ── View Tabs (list / calendar) ── */
.view-tabs {
  display: inline-flex;
  gap: 4px;
  margin-right: 4px;
}
.view-tab {width: 34px; height: 34px; font-family: 'Zpix', monospace; line-height: 1; display: flex; align-items: center; justify-content: center;}
.view-tab:active {transform: translate(2px, 2px);}
.view-tab:focus-visible {outline: 3px solid var(--color-brand); outline-offset: 3px;}
.view-pane[hidden] { display: none !important; }

/* ── Owner toggle group (我 / 共享) ── */
.owner-toggle-group {display: inline-flex; gap: 4px; margin-right: 4px;}
.owner-toggle {height: 34px; font-family: 'Zpix', monospace; line-height: 1;}
.owner-toggle:active {transform: translate(2px, 2px);}
.owner-toggle:focus-visible {outline: 3px solid var(--color-brand); outline-offset: 3px;}
/* ── Settings modal ── */
.modal.settings-modal {
  position: fixed;
  top: 50%; left: 50%;
  bottom: auto;
  width: min(420px, calc(100vw - 32px));
  height: auto;
  max-height: 85vh;
  max-height: 85dvh;
  overflow-y: auto;
  border: 3px solid var(--border-default);
  box-shadow: 6px 6px 0 var(--shadow-pixel);
  transform: translate(-50%, -50%) scale(0.92);
  opacity: 0;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.modal-overlay.open .modal.settings-modal {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
/* 2026-09-22: 已收归共享 .y8y-settings-* （见 shared/chrome/ui.css） */
/* 2026-09-22: 已收归共享 .y8y-settings-* （见 shared/chrome/ui.css） */
.settings-hint {
  font-size: var(--fs-10);
  color: var(--text-muted);
  margin-top: 8px;
}
/* ── 持久项目 (2026-08-11) ── */
.persistent-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.persistent-row input {
  flex: 1;
  padding: 8px 10px;
  background: var(--bg-canvas);
  border: 2px solid var(--border-default);
  color: var(--text-primary);
  font-size: var(--fs-12);
  font-family: 'Zpix', monospace;
  box-shadow: 3px 3px 0 var(--shadow-pixel);
}
/* 添加/移除按钮：自适应文字大小，不撑满 (2026-08-14) */
.persistent-row .btn,
.persistent-project-item .btn {flex: 0 0 auto;}
.persistent-project-list {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.persistent-project-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  background: var(--bg-canvas);
  border: 1px solid var(--border-default);
}
.persistent-project-name {
  font-size: var(--fs-12);
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.persistent-project-remove {
  flex-shrink: 0;
}
.shared-badge {
  font-size: var(--fs-10);
  padding: 2px 6px;
  border: 1px solid var(--color-special);
  color: var(--color-special);
}

/* ── Calendar ── */
.calendar-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 6px;
}
/* 2026-08-12: 月份导航并入 filter-bar 右侧, 与项目/时间筛选并排 */
.filter-cell-calnav {
  flex: 2;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.filter-cell-calnav .calendar-title {
  flex: 1;
  text-align: center;
  font-size: var(--fs-13);
  color: var(--text-primary);
  letter-spacing: 1px;
  text-transform: uppercase;
  min-width: 0;
  white-space: nowrap;
}
.filter-cell-calnav .calendar-nav {
  width: auto;
  min-width: 30px; height: 30px;
  padding: 0 6px;
  font-size: var(--fs-12);
}
.filter-cell-calnav .calendar-today {
  width: auto;
  min-width: 30px; height: 30px;
  padding: 0 8px;
  font-size: var(--fs-11);
  background: var(--color-brand);
  color: var(--bg-surface);
  border-color: var(--color-brand);
}
.filter-cell-calnav .calendar-today:hover { background: var(--color-special); border-color: var(--color-special); }
.calendar-title {
  flex: 1;
  text-align: center;
  font-size: var(--fs-14);
  color: var(--text-primary);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.calendar-nav, .calendar-today {
  width: auto;
  min-width: 34px; height: 34px;
  padding: 0 8px;
  font-size: var(--fs-13);
}
.calendar-today {
  background: var(--color-brand);
  color: var(--bg-surface);
  border-color: var(--color-brand);
}
.calendar-today:hover { background: var(--color-special); border-color: var(--color-special); }

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 0 12px 6px;
  font-size: var(--fs-10);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: center;
}
.calendar-weekdays > div { padding: 4px 0; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 130px;          /* 固定行高,关键 (2026-08-12: 110→130, 月份导航并入 filter-bar 后省出一行, 每格显示 4 个任务) */
  gap: 4px;
  padding: 0 12px 16px;
}
.cal-cell {
  background: var(--bg-surface);
  border: 2px solid var(--border-default);
  height: 130px;                  /* 显式固定 (2026-08-12: 110→130 配合每格 4 任务) */
  min-height: 0;
  padding: 6px 4px 4px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: var(--fs-11);
  position: relative;
  box-shadow: 2px 2px 0 var(--shadow-pixel);
  overflow: hidden;               /* 内容超出截断,关键 */
  cursor: pointer;
}
.cal-cell:hover { background: var(--bg-section); }
.cal-cell.cal-out { opacity: 0.4; }
.cal-cell.cal-today { border-color: var(--color-brand); }
.cal-cell.cal-today .cal-day-num {
  color: var(--color-brand);
  font-weight: bold;
}
.cal-day-num {
  font-size: var(--fs-10);
  color: var(--text-muted);
  letter-spacing: 0.5px;
  flex-shrink: 0;
  display: flex;              /* 2026-08-12: 日期 + 祝日并排 */
  align-items: baseline;
  gap: 4px;
  min-width: 0;
}
.cal-day-num .cal-holiday {
  font-size: var(--fs-10);
  color: var(--color-red);    /* 日本惯例祝日红色 */
  white-space: nowrap;
  overflow: hidden;           /* 2026-08-12: 硬截断, 不要省略号 */
  flex: 0 1 auto;
  min-width: 0;
  letter-spacing: 0;
}
/* 祝日格子的淡粉背景 (2026-08-12: 叠加半透明粉, 不影响格子内任务条) */
.cal-cell.cal-holiday-cell {
  background-image: linear-gradient(rgba(229, 138, 176, 0.16), rgba(229, 138, 176, 0.16));
}
html[data-theme='dark'] .cal-cell.cal-holiday-cell {
  background-image: linear-gradient(rgba(229, 138, 176, 0.14), rgba(229, 138, 176, 0.14));
}
/* 周六格子的淡蓝背景 (2026-08-12: 与祝日/周日的粉层对称) */
.cal-cell.cal-saturday-cell {
  background-image: linear-gradient(rgba(86, 136, 173, 0.14), rgba(86, 136, 173, 0.14));
}
html[data-theme='dark'] .cal-cell.cal-saturday-cell {
  background-image: linear-gradient(rgba(86, 136, 173, 0.12), rgba(86, 136, 173, 0.12));
}
/* 中国法定节假日格子的淡黄背景 (2026-09-23)
   ⚠️ 必须放在祝日粉/周六蓝之后 —— 同特异性下"后写的胜", 这就是「周六是中秋时黄底要覆盖蓝底」的实现。
     暗色块用 html[data-theme='dark'] (特异性 0,3,0) 且同样排在周末暗色块之后, 否则会被周末压回去。 */
.cal-cell.cal-cn-holiday-cell {
  background-image: linear-gradient(rgba(199, 160, 82, 0.34), rgba(199, 160, 82, 0.34));
}
html[data-theme='dark'] .cal-cell.cal-cn-holiday-cell {
  background-image: linear-gradient(rgba(199, 160, 82, 0.24), rgba(199, 160, 82, 0.24));
}
/* 中国调休上班日「班」标签 (2026-09-23: 那天是周末补班, 不是休息) */
.cal-day-num .cal-workday {
  font-size: var(--fs-10);
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  flex: 0 1 auto;
  min-width: 0;
  letter-spacing: 0;
}
.cal-cell.cal-out .cal-day-num { color: var(--text-muted); }
.cal-tasks {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;                        /* 占据剩余空间 */
  overflow: hidden;               /* 内容超出截断 */
  min-height: 0;
}
.cal-task {
  font-size: var(--fs-10);
  line-height: 1.3;
  padding: 2px 4px;
  background: var(--bg-section);
  color: var(--text-primary);
  cursor: pointer;
  word-break: break-all;
  display: flex; align-items: center; gap: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-shrink: 0;
  min-height: 16px;
  /* 拖拽改期 (2026-09-16): 保留垂直滚动, 水平手势留给拖拽逻辑 */
  touch-action: pan-y;
}
/* 已完成任务弱化 (2026-08-18: 日历「显示已完成」开关开启时) */
.cal-task.cal-task-done {
  opacity: 0.55;
  filter: saturate(0.4);
  text-decoration: line-through;
  text-decoration-color: rgba(16,19,28,0.5);
}
.cal-task:hover { filter: brightness(1.15); }

/* ── 日历任务拖拽改期 (2026-09-16 v1): 桌面直接拖 / 手机长按拖 ── */
.cal-task.cal-drag-armed {           /* 长按已触发, 等待移动 */
  outline: 2px solid var(--color-brand);
  outline-offset: -1px;
}
.cal-task.cal-task-dragging {        /* 拖拽中: 原位置留个淡影 */
  opacity: 0.3;
}
.cal-drag-ghost {                    /* 跟随指针的拖影 */
  position: fixed;
  z-index: 500;
  pointer-events: none;
  padding: 2px 6px;
  font-size: var(--fs-10);
  line-height: 1.3;
  max-width: 150px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: var(--c-cyan);
  color: #10131c;
  border: 2px solid var(--color-brand);
  box-shadow: 3px 3px 0 var(--shadow-pixel);
  opacity: 0.95;
  transform: translate(-50%, -120%) scale(1.05);
}
.cal-drag-ghost.is-same {            /* 落回原日期: 提示无效 */
  background: var(--bg-section);
  color: var(--text-muted);
  border-style: dashed;
}
.cal-cell.cal-drop-target {          /* 可放置目标格 */
  background: var(--bg-section);
  border-color: var(--color-brand);
  border-style: dashed;
}
.cal-cell.cal-drop-target .cal-day-num { color: var(--color-brand); }
/* 任务条整条背景 = 自选颜色（2026-08-11: 替代左侧竖条）;
   文字用深色保证亮/暗模式在彩色背景上都清晰 (2026-08-11 实测暖白字在红/黄上不可读) */
.cal-task.color-yellow { background: var(--c-yellow); color: #10131c; }
.cal-task.color-green { background: var(--c-green); color: #10131c; }
.cal-task.color-pink { background: var(--c-pink); color: #10131c; }
.cal-task.color-purple { background: var(--c-purple); color: #10131c; }
.cal-task.color-orange { background: var(--c-orange); color: #10131c; }
.cal-task.color-red { background: var(--c-red); color: #10131c; }
.cal-task.color-blue { background: var(--c-blue); color: #10131c; }
.cal-task.color-cyan { background: var(--c-cyan); color: #10131c; }
/* 跨天任务横条（2026-08-11 二版: 一条横跨, 名字只显示一次） */
.cal-span-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-10);
  line-height: 1.2;
  padding: 2px 6px;
  height: 16px;              /* 与单日任务条同高 (2026-08-11: 原 20px 太粗) */
  min-width: 0;
  background: var(--bg-section);
  color: var(--text-primary);
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  align-self: start;
  margin-top: 20px;             /* 紧贴日期数字下方 (数字底 18px + 2px, 2026-08-11: 原 24px 太靠下) */
  z-index: 2;
  box-shadow: 2px 2px 0 var(--shadow-pixel);
}
.cal-span-bar:hover { filter: brightness(1.15); }
.cal-span-bar.color-yellow { background: var(--c-yellow); color: #10131c; }
.cal-span-bar.color-green { background: var(--c-green); color: #10131c; }
.cal-span-bar.color-pink { background: var(--c-pink); color: #10131c; }
.cal-span-bar.color-purple { background: var(--c-purple); color: #10131c; }
.cal-span-bar.color-orange { background: var(--c-orange); color: #10131c; }
.cal-span-bar.color-red { background: var(--c-red); color: #10131c; }
.cal-span-bar.color-blue { background: var(--c-blue); color: #10131c; }
.cal-span-bar.color-cyan { background: var(--c-cyan); color: #10131c; }
/* 跨周续段: 不再显示标题, 只显示延续箭头 */
.cal-span-bar-cont {
  color: #10131c;
  justify-content: center;
}
/* 跨天已完成任务横条弱化 (2026-08-18) */
.cal-span-bar.cal-span-bar-done {
  opacity: 0.55;
  filter: saturate(0.4);
  text-decoration: line-through;
  text-decoration-color: rgba(16,19,28,0.5);
}
/* 有跨天横条的格子: 单日任务区下移避让 (2026-08-11: 28px→18px, 横条上移后缩小避让, 下面任务不被挤出) */
.cal-cell-has-span .cal-tasks { margin-top: 18px; }
.cal-task-title {
  flex: 0 1 auto;                 /* 按内容宽度，不撑满（2026-08-13: 原 flex:1 导致短标题时项目名被推到最右, 中间大片空白） */
  min-width: 0;                   /* 允许收缩 */
  overflow: hidden;               /* 硬截断,不用省略号,最大化显示字符 */
  white-space: nowrap;
}
/* 任务条内项目名: 深色小字紧跟标题, 硬截断 (2026-08-12 初版淡灰; 2026-08-13 加深——彩色背景上淡灰+opacity 看不见; 同日二次调整: 再淡 30% 保持主次) */
.cal-task-project {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 45%;
  font-size: var(--fs-10);
  color: inherit;                 /* 继承任务条深色文字 #10131c, 彩色背景上清晰可读 */
  opacity: 0.7;                   /* 2026-08-13: 先 opacity 1 可见, 再淡 30% 区分主次 */
  overflow: hidden;
  white-space: nowrap;
  text-overflow: clip;            /* 硬截断, 不要省略号 */
  flex-shrink: 1;
}
.cal-more {
  font-size: var(--fs-10);
  color: var(--text-muted);
  cursor: pointer;
  padding: 1px 4px;
  flex-shrink: 0;
}
.cal-more:hover { color: var(--color-brand); }

/* 手机端日历尺寸 —— ⚠️ 本 @media 头在 2026-09-22 主题统一那次被误删,
   导致手机端的 110px 行高/紧凑 padding 泄漏到全宽度; 2026-09-23 恢复。 */
@media (max-width: 640px) {
  /* 手机端横向占位压缩(2026-08-11): padding/gap/竖条都收紧,文字最大化 */
  .calendar-grid { grid-auto-rows: 110px; gap: 2px; padding: 0 6px 10px; }  /* 2026-08-12: 96→110, 每格 4 任务完整显示 */
  .calendar-weekdays { gap: 2px; padding: 0 6px 6px; }  /* 与 grid 列对齐 */
  .cal-cell { height: 110px; min-height: 0; padding: 2px 1px 2px; gap: 2px; }  /* 2026-08-12: 72→110 */
  .cal-task { font-size: var(--fs-10); padding: 1px 1px; min-height: 14px; border-left-width: 2px; }
  /* 移动端: 任务条允许换行, 项目名换到第二行独占一行 (2026-08-13); 行距压到 2px 只微微分开 (2026-08-13 二次) */
  .cal-task { flex-wrap: wrap; row-gap: 2px; column-gap: 4px; }
  .cal-task-project {
    flex-basis: 100%;
    max-width: 100%;
    flex-shrink: 0;
  }
  /* 移动端: 数字底只有 14px, 横条上移贴数字, 任务区避让同步缩小, 防止遮住单日任务 (2026-08-12) */
  .cal-span-bar { margin-top: 16px; }
  .cal-cell-has-span .cal-tasks { margin-top: 18px; }
  /* 任务标题单行硬截断(2026-08-11: 不要自动换行) */
  .cal-task-title {
    display: block;
    white-space: nowrap;
    overflow: hidden;
  }
  /* 项目菜单: 按钮全宽后 absolute 跟随即可(原 fixed 定位是按钮窄时的补丁, 2026-08-11 移除) */
  .project-menu {
    max-height: calc(100vh - 84px);
    max-height: calc(100dvh - 84px);
  }
}

/* ── Day Drawer (centered pixel modal) ── */
.day-drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);   /* 2026-09-22 与共享 .y8y-overlay 同值 */
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 20px;
}
.day-drawer-overlay.open { display: flex; }
.day-drawer {
  background: var(--bg-canvas);
  border: 3px solid var(--border-default);
  box-shadow: 6px 6px 0 var(--shadow-pixel);
  width: min(480px, 100%);
  max-height: min(80vh, 600px);
  display: flex;
  flex-direction: column;
  font-family: 'Zpix', monospace;
}
.day-drawer-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 2px solid var(--border-default);
  background: var(--bg-section);
  gap: 8px;
}
.day-drawer-title {
  flex: 1;
  font-size: var(--fs-13);
  color: var(--text-primary);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.day-drawer-title .count {
  color: var(--color-brand);
  margin-left: 8px;
}
.day-drawer-add {
  height: 32px;
  padding: 0 10px;
  background: var(--color-brand);
  color: var(--bg-surface);
  border: 2px solid var(--text-primary);
  font-family: 'Zpix', monospace;
  font-size: var(--fs-12);
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--shadow-pixel);
  display: flex; align-items: center; justify-content: center;
  /* 2026-09-20 报告「icon 和文字糊在一起」：flex 容器会吃掉 HTML 里的
     纯空白文本节点 → 图标与文字贴死（实测空隙 0px）。必须显式 gap。 */
  gap: 5px;
  white-space: nowrap;
}
.day-drawer-add:hover { background: var(--bg-surface); color: var(--color-brand); }
.day-drawer-add:active {
  transform: translate(2px, 2px);
  box-shadow: 0px 0px 0 var(--shadow-pixel);
}
.day-drawer-add:focus-visible {
  outline: 3px solid var(--color-brand);
  outline-offset: 2px;
}
.day-drawer-close {
  width: 32px; height: 32px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 2px solid var(--border-default);
  font-family: 'Zpix', monospace;
  font-size: var(--fs-14);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 2px 2px 0 var(--shadow-pixel);
  padding: 0;
}
.day-drawer-close:hover { background: var(--bg-section); }
.day-drawer-close:active {
  transform: translate(2px, 2px);
  box-shadow: 0px 0px 0 var(--shadow-pixel);
}
.day-drawer-body {
  padding: 12px 16px;
  overflow-y: auto;
  flex: 1;
}
.day-drawer-body .card {
  margin-bottom: 8px;
}
.day-drawer-empty {
  text-align: center;
  color: var(--text-muted);
  font-size: var(--fs-12);
  padding: 32px 16px;
  letter-spacing: 1px;
}

@media (max-width: 640px) {
  .day-drawer { width: 100%; max-height: 85vh; }
  .day-drawer-overlay { padding: 8px; }
}

/* ── Section ── */
.section { margin: 6px 0; }
.section-header {
  padding: 12px 16px 6px;
  font-size: var(--fs-12);
  color: var(--text-primary);
  display: flex; align-items: center; gap: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: bold;
}
.section-header .badge {
  font-size: var(--fs-10);
  background: var(--bg-section);
  color: var(--text-muted);
  padding: 2px 8px;
  border: 1px solid var(--border-default);
}
.divider {
  height: 0;
  border: 0;
  border-top: 2px solid var(--border-default);
  margin: 0 16px 4px;
}

/* ── Card ── */
.card {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px;
  margin: 0 12px 10px;
  background: var(--bg-surface);
  border: 3px solid var(--border-default);
  cursor: pointer;
  position: relative;
  box-shadow: 6px 6px 0 var(--shadow-pixel),
              inset 2px 2px 0 var(--highlight-pixel);
}
.card:active {
  transform: translate(3px, 3px);
  box-shadow: 3px 3px 0 var(--shadow-pixel);
}
.card.done { opacity: 0.4; }
.card-body { flex: 1; min-width: 0; }
.card-title {
  font-size: var(--fs-13);
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 3px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  line-height: 1.7;
}
.card-preview {
  font-size: var(--fs-11);
  color: var(--text-primary);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  /* 2026-08-11: 预览最多 5 行, 不显示全文 */
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 5;
  overflow: hidden;
}
.card-meta {
  display: flex; align-items: center; gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}

/* ── Card color: 左侧竖条 (2026-08-11: 整框变色颜色太多眼睛不舒服, 改回左竖条) ── */
.card.color-yellow { border-left-width: 4px; border-left-color: var(--c-yellow); }
.card.color-green { border-left-width: 4px; border-left-color: var(--c-green); }
.card.color-pink { border-left-width: 4px; border-left-color: var(--c-pink); }
.card.color-purple { border-left-width: 4px; border-left-color: var(--c-purple); }
.card.color-orange { border-left-width: 4px; border-left-color: var(--c-orange); }
.card.color-red { border-left-width: 4px; border-left-color: var(--c-red); }
.card.color-blue { border-left-width: 4px; border-left-color: var(--c-blue); }
.card.color-cyan { border-left-width: 4px; border-left-color: var(--c-cyan); }

/* ── Color Picker (2026-08-11: 自选颜色) ── */
.color-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 2px 0;
}
.color-swatch {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border-default);
  border-radius: 50%;
  cursor: pointer;
  padding: 0;
  transition: transform 0.1s;
}
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.active {
  border-color: var(--text-primary);
  box-shadow: 0 0 0 2px var(--bg-section), 0 0 0 3px var(--text-primary);
}
.sw-yellow { background: var(--c-yellow); }
.sw-green { background: var(--c-green); }
.sw-pink { background: var(--c-pink); }
.sw-purple { background: var(--c-purple); }
.sw-orange { background: var(--c-orange); }
.sw-red { background: var(--c-red); }
.sw-blue { background: var(--c-blue); }
.sw-cyan { background: var(--c-cyan); }

/* ── Due Badge ── */
.due-badge {
  font-size: var(--fs-10);
  padding: 2px 6px;
  border: 1px solid var(--border-default);
  color: var(--text-muted);
  display: inline-block;
  background: var(--bg-section);
}
.due-overdue {
  color: var(--color-danger);
  border-color: var(--color-danger);
  font-weight: bold;
}
.due-today {
  color: var(--color-info);
  border-color: var(--color-info);
  font-weight: bold;
}
.recurring-badge {
  font-size: var(--fs-10);
  padding: 2px 6px;
  border: 1px solid var(--color-success);
  color: var(--color-success);
  font-weight: bold;
  display: inline-block;
  background: var(--bg-section);
}

/* ── Project Badge (2026-08-11: 颜色跟随任务自选色, 不再固定青色) ── */
.project-badge {
  font-size: var(--fs-10);
  padding: 2px 6px;
  border: 1px solid var(--color-info);
  color: var(--color-info);
  font-weight: bold;
  display: inline-block;
  /* 2026-09-20：「文字偏下 2.1px」已由**共享层根因修复**解决 ——
     icons.css 把 .y8i 的 vertical-align 从 -0.18em 改为 middle。
     这里不再需要局部 flex 补丁（保持单一来源；实测只靠共享规则即为 4.5/5.5 居中）。 */
  letter-spacing: 0.5px;
  background: var(--bg-section);
}
.project-badge.color-yellow { border-color: var(--c-yellow); color: var(--c-yellow); }
.project-badge.color-green { border-color: var(--c-green); color: var(--c-green); }
.project-badge.color-pink { border-color: var(--c-pink); color: var(--c-pink); }
.project-badge.color-purple { border-color: var(--c-purple); color: var(--c-purple); }
.project-badge.color-orange { border-color: var(--c-orange); color: var(--c-orange); }
.project-badge.color-red { border-color: var(--c-red); color: var(--c-red); }
.project-badge.color-blue { border-color: var(--c-blue); color: var(--c-blue); }
.project-badge.color-cyan { border-color: var(--c-cyan); color: var(--c-cyan); }
.project-group-header {
  font-size: var(--fs-11);
  font-weight: bold;
  color: var(--color-info);
  padding: 12px 4px 4px;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 2px dashed var(--color-info);
  margin: 16px 0 8px;
}

/* ── Checkbox (y8y controls — square, hard shadow, press feedback) ── */
.checkbox {
  width: 24px; height: 24px;
  flex-shrink: 0;
  margin-top: 2px;
  border: 2px solid var(--border-default);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  background: var(--bg-canvas);
  box-shadow: 2px 2px 0 var(--shadow-pixel);
}
.checkbox:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}
.checkbox.checked {
  background: var(--color-success);
  border-color: var(--color-success);
  box-shadow: 2px 2px 0 var(--shadow-pixel);
}
.checkbox.checked::after {
  content: '✓';
  color: var(--bg-surface);
  font-size: var(--fs-14);
  font-weight: bold;
}
.completed-card {
  cursor: default;
  opacity: 0.82;
}
.checkbox-done {
  background: var(--color-success);
  border-color: var(--color-success);
  color: var(--bg-surface);
  cursor: default;
  font-size: var(--fs-14);
  font-weight: bold;
}
.completed-badge {
  font-size: var(--fs-10);
  padding: 2px 6px;
  border: 1px solid var(--color-success);
  color: var(--color-success);
  font-weight: bold;
  display: inline-block;
  background: var(--bg-section);
}

/* ── Shopping View (2026-08-18 独立购物列表) ── */
.shopping-listbar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px 0;
  flex-wrap: wrap;
}
.shopping-listbar .list-switcher {
  position: relative;
}
.shopping-listbar .project-trigger {
  border: 2px solid var(--border-default);
  background: var(--bg-surface);
  box-shadow: 3px 3px 0 var(--shadow-pixel);
  padding: 6px 10px;
  font-size: var(--fs-12);
  cursor: pointer;
}
.shopping-listbar .project-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  background: var(--bg-surface); border: 2px solid var(--border-default);
  box-shadow: 3px 3px 0 var(--shadow-pixel); min-width: 180px;
}
.shopping-list-owner {
  font-size: var(--fs-11); color: var(--text-muted);
}
.shopping-list-actions {
  margin-left: auto; display: flex; gap: 6px;
}
.shopping-list-actions .btn {flex: 0 0 auto !important;}
.shopping-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px 8px;
}
.shopping-bar input {
  flex: 1; min-width: 0;
  height: 34px;
  padding: 0 10px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 2px solid var(--border-default);
  box-shadow: 3px 3px 0 var(--shadow-pixel);
  font-family: 'Zpix', monospace;
  font-size: var(--fs-12);
}
.shopping-bar textarea {
  flex: 1; min-width: 0;
  height: 34px;
  padding: 6px 10px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 2px solid var(--border-default);
  box-shadow: 3px 3px 0 var(--shadow-pixel);
  font-family: 'Zpix', monospace;
  font-size: var(--fs-12);
  resize: vertical;
  line-height: 1.5;
  box-sizing: border-box;
}
.shopping-bar input:focus-visible, .shopping-bar textarea:focus-visible {
  outline: 3px solid var(--color-brand);
  outline-offset: 2px;
}
.shopping-clear-row {
  padding: 0 16px 8px;
  display: flex;
  justify-content: flex-end;
}
.shopping-clear-btn {
  flex: 0 0 auto !important;
  padding: 5px 10px !important;
  font-size: var(--fs-11);
}
.shopping-item {
  display: flex; align-items: center; gap: 10px;
  margin: 0 12px 8px;
  padding: 10px 12px;
  background: var(--bg-surface);
  border: 3px solid var(--border-default);
  box-shadow: 4px 4px 0 var(--shadow-pixel);
}
.shopping-item-done {
  opacity: 0.55;
}
.shopping-item-done .shopping-name {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  text-decoration-color: var(--color-brand);
}
.shopping-check {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  background: var(--bg-section);
  color: var(--text-primary);
  border: 2px solid var(--border-default);
  cursor: pointer;
  font-family: 'Zpix', monospace;
  font-size: var(--fs-12);
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 2px 2px 0 var(--shadow-pixel);
  padding: 0;
}
.shopping-check:hover { background: var(--bg-canvas); }
.shopping-check:focus-visible { outline: 3px solid var(--color-brand); outline-offset: 2px; }
.shopping-check[aria-pressed="true"] {
  color: var(--color-success);
  border-color: var(--color-success);
}
.shopping-name {
  flex: 1; min-width: 0;
  font-size: var(--fs-13);
  font-weight: 700;
  line-height: 1.7;          /* 长文本多行时加行距, 不挤 (2026-08-20) */
  color: var(--text-primary);
  word-break: break-word;
}
.shopping-del {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  background: transparent;
  color: var(--text-muted);
  border: 2px solid var(--border-default);
  cursor: pointer;
  font-family: 'Zpix', monospace;
  font-size: var(--fs-12);
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.shopping-del:hover { color: var(--color-danger); border-color: var(--color-danger); }
.shopping-del:focus-visible { outline: 3px solid var(--color-brand); outline-offset: 2px; }

/* 一键复制全文按钮 (2026-08-20) */
.shopping-copy {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  background: transparent;
  color: var(--text-muted);
  border: 2px solid var(--border-default);
  cursor: pointer;
  font-family: 'Zpix', monospace;
  font-size: var(--fs-12);
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.shopping-copy:hover { color: var(--color-brand); border-color: var(--color-brand); }
.shopping-copy:focus-visible { outline: 3px solid var(--color-brand); outline-offset: 2px; }

/* 编辑条目按钮 (2026-08-20) */
.shopping-edit {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  background: transparent;
  color: var(--text-muted);
  border: 2px solid var(--border-default);
  cursor: pointer;
  font-family: 'Zpix', monospace;
  font-size: var(--fs-12);
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.shopping-edit:hover { color: var(--color-info); border-color: var(--color-info); }
.shopping-edit:focus-visible { outline: 3px solid var(--color-brand); outline-offset: 2px; }

/* 编辑弹窗 textarea */
.shop-edit-modal textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 120px;
  padding: 8px 10px;
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 2px solid var(--border-default);
  font-family: 'Zpix', monospace;
  font-size: var(--fs-13);
  line-height: 1.6;
  resize: vertical;
}
.shop-edit-modal textarea:focus { outline: 3px solid var(--color-brand); outline-offset: 1px; }
.shopping-item-done .shopping-name { cursor: default; }
.shopping-completed-controls {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.shopping-completed-page {
  color: var(--text-muted);
  font-size: var(--fs-10);
  white-space: nowrap;
}
.shopping-completed-nav {
  flex: 0 0 auto !important;
  padding: 4px 8px !important;
  font-size: var(--fs-10);
}
.shopping-completed-nav:disabled {
  color: var(--text-muted);
  cursor: not-allowed;
  opacity: .5;
}

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
  font-size: var(--fs-12);
  line-height: 2;
}

/* ── Header ＋ 新建任务 (2026-08-11: 右上角纯 + 号, 无文字) ── */
.add-task-btn {
  background: var(--color-brand);
  color: var(--bg-surface);
  border-color: var(--text-primary);
  font-size: var(--fs-16);
  font-weight: bold;
  box-shadow: 3px 3px 0 var(--shadow-pixel);
}
.add-task-btn:hover {
  background: var(--bg-surface);
  color: var(--color-brand);
}
.add-task-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--shadow-pixel);
}
.add-task-btn:focus-visible {
  outline: 3px solid var(--color-brand);
  outline-offset: 3px;
}

/* ── Modal ── */
/* 2026-09-22: z-index/background 收归共享 .y8y-overlay（见 shared/chrome/ui.css） */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
}
.modal-overlay.open { display: block; }
.modal {
  position: fixed; bottom: 0; z-index: 301;
  background: var(--bg-surface);
  border-top: 3px solid var(--border-default);
  padding: 0;
  height: 100vh;              /* 全屏高度 (2026-08-11: 弹窗占满整屏) */
  height: 100dvh;             /* 移动端动态视口,地址栏伸缩不遮挡 */
  max-height: none;
  display: flex;
  flex-direction: column;     /* handle/h2/表单区/按钮栏 纵向铺满 */
  left: 0; right: 0;
  transform: translateY(100%);
  transition: transform 0.25s ease;
  box-shadow: 0 -8px 0 var(--shadow-pixel);
}
.modal-overlay.open .modal { transform: translateY(0); }
/* settings 居中弹窗覆盖 .modal 的全屏 bottom-sheet 定位 (须在 .modal 规则之后) */
.modal-overlay.open .modal.settings-modal {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
.modal-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 24px 4px;
  flex-shrink: 0;
}
.modal-topbar h2 {
  flex: 1;
  min-width: 0;
  margin-bottom: 0;
  padding: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 表单区自适应占满剩余高度,内容多时滚动; 按钮栏固定贴底 */
.modal-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;   /* 2026-08-18: 滚动到底不穿透到背景主页面 */
  -webkit-overflow-scrolling: touch;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
}
/* 弹窗打开时锁定背景 body 滚动 (2026-08-18: 防止滚动穿透主页面) */
body.modal-locked {
  overflow: hidden;
  overscroll-behavior: none;
}
/* 「内容」文本框拉伸填满表单区剩余高度 (2026-08-11: 无底部空白)
   ⚠️ 必须用直接子级选择器: 用后代选择器时, 每个 .form-row 里的**最后一个** .form-group
   也会命中 (它们都是 div 的 last-of-type) → 那一格被压成 flex:1 1 0%, 手机端挤成 28px
   (2026-09-23 手机端「截止时间」「项目」点不到的根因) */
.modal-body > .form-group:last-of-type {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.modal-body > .form-group:last-of-type textarea {
  flex: 1;
  min-height: 80px;
}
/* 内容预览容器 (2026-08-13 方案A: markdown 渲染 + 可点 checkbox) */
.content-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.content-label-row label { margin: 0; }
.content-preview {
  flex: 1;
  min-height: 80px;
  overflow-y: auto;
  background: var(--bg-section);
  border: 2px solid var(--border-default);
  padding: 10px 12px;
  font-size: var(--fs-12);
  line-height: 1.7;
  color: var(--text-primary);
}
.content-preview .md-h1 { font-size: var(--fs-16); font-weight: bold; margin: 8px 0 4px; }
.content-preview .md-h2 { font-size: var(--fs-13); font-weight: bold; margin: 6px 0 3px; }
.content-preview .md-h3 { font-size: var(--fs-12); font-weight: bold; margin: 4px 0 2px; }
.content-preview .md-p { margin: 3px 0; }
.content-preview .md-li { margin: 2px 0; padding-left: 14px; position: relative; }
.content-preview .md-li::before { content: '•'; position: absolute; left: 2px; }
.content-preview .md-space { height: 6px; }
.content-preview code {
  background: var(--bg-canvas);
  padding: 0 4px;
  font-size: var(--fs-11);
  border: 1px solid var(--border-default);
}
.content-preview .md-empty { color: var(--text-muted); }
/* checkbox 行: 可点击, hover 提示 */
.content-preview .md-cb {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: 2px 0;
  padding: 2px 0;
  cursor: pointer;
  border-radius: 2px;
}
.content-preview .md-cb:hover { background: var(--bg-hover, var(--bg-canvas)); }
.content-preview .md-cb input[type="checkbox"] {
  margin-top: 3px;
  accent-color: var(--color-brand);
  cursor: pointer;
  flex-shrink: 0;
  /* 2026-08-15 修: .form-group input 的 width:100% 会把 checkbox 拉成整行宽,
     文字被挤成 12px 窄列断成几百行 (用户报「toggle 按钮占绝大部分, 文字看不见」) */
  width: 13px;
  height: 13px;
}
.content-preview .md-cb.done span { text-decoration: line-through; opacity: 0.6; }
.content-preview .md-cb span { word-break: break-word; white-space: pre-wrap; }
/* 按钮栏: 顶部右侧 (2026-08-11: 删除/取消/保存放最上面右侧) */
.modal-actions {
  flex-shrink: 0;
  display: flex; gap: 8px;
}
.modal-handle {
  width: 40px; height: 4px;
  background: var(--border-default);
  margin: 16px auto 14px;
  flex-shrink: 0;
}
.modal h2 {
  font-size: var(--fs-14);
  color: var(--text-primary);
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: bold;
  /* 间距由 .modal-topbar 控制 (2026-08-11) */
}
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: var(--fs-10);
  color: var(--text-muted);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-canvas);
  border: 2px solid var(--border-default);
  color: var(--text-primary);
  font-size: var(--fs-12);
  font-family: 'Zpix', monospace;
  box-shadow: 3px 3px 0 var(--shadow-pixel);
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--color-brand);
  box-shadow: 3px 3px 0 var(--color-brand);
}
.form-group textarea {
  resize: vertical;
  min-height: 80px;
  line-height: 1.8;  /* 2026-08-11: 内容行距太挤, 拓展开 */
}
.form-row { display: flex; gap: 10px; flex-wrap: wrap; }
/* 窄屏一行塞不下 3 个字段时换行, 而不是让第 3 个挤出屏幕
   (2026-09-23: 手机新建任务弹窗里「截止时间」跑到屏幕右边点不到)
   ⚠️ flex-shrink 必须是 0 —— 允许收缩时 flex 会硬挤成 28px 而不是换行 */
.form-row .form-group { flex: 1 0 140px; min-width: 0; }
/* 旧的 .modal-actions margin-top 规则已并入上方全屏布局 (2026-08-11) */

/* ── Buttons (y8y §action buttons) ── */
.btn {flex: 1; font-family: 'Zpix', monospace;}
.btn:active {transform: translate(3px, 3px);}
.btn:focus-visible {outline: 3px solid var(--color-brand); outline-offset: 3px;}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--bg-section);
  color: var(--text-primary);
  padding: 10px 20px;
  font-size: var(--fs-11);
  z-index: 400;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  white-space: nowrap;
  border: 2px solid var(--border-default);
  box-shadow: 4px 4px 0 var(--shadow-pixel);
}
.toast.show { opacity: 1; }

/* ── Responsive ── */
/* ⚠️ 2026-09-22 主题统一那次把本区的 @media 头全部误删,
   桌面端 4:3 卡片宽度因此泄漏到手机 (手机新建任务弹窗被撑到 760px、左右都出屏);
   2026-09-23 恢复。改这段务必确认 @media 头/尾成对。 */
@media (min-width: 600px) {
  /* 桌面端 4:3 横屏卡片（2026-08-11）: 宽度 = min(视口高×4/3, 760px),
     比原 480px 宽很多 → 日历格子更宽,任务标题能显示更多文字 */
  :root { --desktop-w: min(calc(100vh * 4 / 3), 760px); }
  body { max-width: var(--desktop-w); margin: 0 auto; }
  .modal { left: calc((100vw - var(--desktop-w)) / 2); right: calc((100vw - var(--desktop-w)) / 2); }
}

@media (max-width: 390px) {
  .header .count { display: none; }
  .filter-bar { padding: 6px 12px; gap: 6px; }
  .filter-bar .project-trigger { padding: 0 7px; font-size: var(--fs-10); }
}

/* ── prefers-reduced-motion (y8y §10 accessibility) ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  /* Static CRT scanlines stay visible: reduced motion only disables movement. */
}

  /* 页面主体（header 之外）的图标统一 14px（2026-09-20 定案）。
     特异性低于共享 header.css 的 .header .y8i（(0,2,0) vs (0,1,0)），
     所以 header 里的图标仍保持 20px，不受这条影响。 */
  .y8i { --y8i-size: var(--y8i-14, 14px); }
  .header .view-tab:hover {opacity: 1;}
  .header .view-tab:active {transform: none;}
  /* 激活项：把图标 URL 换成橙色版（覆盖 --d/--l，主题切换机制不变） */
  .header .view-tab[aria-selected="true"] .y8i-list {--d: url("/assets/icons/ui/list-accent.png?v=16"); --l: url("/assets/icons/ui/list-accent-light.png?v=16");}
  .header .view-tab[aria-selected="true"] .y8i-calendar {--d: url("/assets/icons/ui/calendar-accent.png?v=16"); --l: url("/assets/icons/ui/calendar-accent-light.png?v=16");}
  .header .view-tab[aria-selected="true"] .y8i-cart {--d: url("/assets/icons/ui/cart-accent.png?v=16"); --l: url("/assets/icons/ui/cart-accent-light.png?v=16");}</style>
</head>
<body>

<header class="header">
  <a class="brand-img" href="https://example.com/" title="前往 y8ySYSTEMS 控制台" aria-label="前往 y8ySYSTEMS 控制台">
    <span class="brand-mark">
      <img id="y8y-logo" src="assets/brand/logo_zoom.png?v=2" alt="y8y"
           onerror="this.hidden=true; document.getElementById('y8y-wordmark').hidden=false;" />
      <span id="y8y-wordmark" hidden class="logo-accent">y8y</span>
    </span>
  </a>
  <a class="brand-title" href="/" title="返回 y8yTODO 首页">
    <h1><span class="logo-accent">y8y</span>TODO</h1>
  </a>
  
  
  <div class="header-right y8y-header-center">
    <div class="view-tabs" role="tablist" aria-label="视图切换">
      <!-- 2026-09-23：data-y8y-menu-label = 手机端进 ☰ 菜单后补的文字（header 上空间紧、只放图标，
           菜单里没这个限制）—— 由共享 /assets/ui.js 在面板态生成 <span class="y8y-menu-label">、
           宽屏还原时移除。 -->
      <button class="view-tab y8y-seg-flat y8y-slot-item" id="viewTabList" role="tab" aria-selected="false" data-view="list" title="列表视图" data-y8y-menu-label="列表"><span class="y8i y8i-list"></span></button>
      <button class="view-tab y8y-seg-flat y8y-slot-item" id="viewTabCalendar" role="tab" aria-selected="true" data-view="calendar" title="日历视图" data-y8y-menu-label="日历"><span class="y8i y8i-calendar"></span></button>
      <button class="view-tab y8y-seg-flat y8y-slot-item" id="viewTabShopping" role="tab" aria-selected="false" data-view="shopping" title="购物列表" data-y8y-menu-label="购物"><span class="y8i y8i-cart"></span></button>
    </div>
  </div>

  
  
  <!-- 右侧槽（容器契约 .y8y-header-right）：靠右由**容器**承担，所以组内顺序自由。
       动作按钮（新建任务）：语义固化 —— 有副作用的动作放右侧、橙色，不进中间槽。 -->
  <div class="y8y-header-right">
    <button type="button" class="theme-toggle add-task-btn y8y-header-action" id="fabAdd" aria-label="新建任务" title="新建任务" data-y8y-menu-label="新建任务"><span class="y8i y8i-add"></span></button>
    <button type="button" class="y8y-refresh-btn" title="刷新数据（不重载页面）" aria-label="刷新数据"><span class="y8i y8i-reload"></span></button>
    <button type="button" class="settings-btn" id="settingsBtn" title="设置" aria-label="设置" aria-haspopup="dialog"><span class="y8i y8i-settings"></span></button>
  </div>
</header>

<!-- Filter bar: 项目 + 时间并排 sticky (2026-08-11) -->
<div class="filter-bar">
  <div class="filter-cell filter-cell-project" id="filterCellProject">
    <div class="project-switcher" id="projectSwitcher">
      <button class="project-trigger" id="projectTrigger" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="project-trigger-label" id="projectTriggerLabel"><span class="y8i y8i-bookmark"></span> 所有任务</span>
        <span class="project-caret" aria-hidden="true"><span class="y8i y8i-expand"></span></span>
      </button>
      <div class="project-menu" id="projectMenu" role="menu" aria-label="选择项目"></div>
    </div>
  </div>
  <div class="filter-cell filter-cell-time">
    <div class="time-switcher" id="timeSwitcher">
      <button class="project-trigger" id="timeTrigger" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="project-trigger-label" id="timeTriggerLabel">全部</span>
        <span class="project-caret" aria-hidden="true"><span class="y8i y8i-expand"></span></span>
      </button>
      <div class="project-menu" id="timeMenu" role="menu" aria-label="时间范围"></div>
    </div>
  </div>
  <!-- 日历月份导航: 与项目筛选并排 (2026-08-12: 原独立一行占空间, 并入 filter-bar 右侧) -->
  <div class="filter-cell filter-cell-calnav" id="calNavCell" style="display:none;">
    <button class="theme-toggle calendar-nav" id="calPrev" type="button" aria-label="上个月"><span class="y8i y8i-pager" style="transform:scaleX(-1)"></span></button>
    <div class="calendar-title" id="calTitle">—</div>
    <button class="theme-toggle calendar-nav" id="calNext" type="button" aria-label="下个月"><span class="y8i y8i-pager"></span></button>
    <button class="theme-toggle calendar-today" id="calToday" type="button" aria-label="回到今天">今日</button>
  </div>
</div>

<!-- View: List -->
<div id="viewList" class="view-pane" data-view="list" hidden>
  <div id="taskList"></div>
</div>

<!-- View: Calendar -->
<div id="viewCalendar" class="view-pane" data-view="calendar">
  <div class="calendar-weekdays" aria-hidden="true">
    <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
  </div>
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- View: Shopping (2026-08-18 独立购物列表, 升级为「列表系统」: 购物+自建列表, 可设归属) -->

<script>
let allTasks = [];
let completedTasks = [];
let sections = {};
let currentUser = 'alice';   // 来自 API current_user (alice/bob)
let showMine = true;        // 点亮「我」按钮
let showShared = true;      // 点亮「共享」按钮（最少亮一个）
let showLegacyAgent = localStorage.getItem('todoShowLegacyAgent') !== '0';  // legacy-hardware-calendar 日历开关 (2026-08-14, 默认开)
let calTodoOnly = localStorage.getItem('todoCalTodoOnly') === '1';  // 日历仅显示未完成 (2026-08-18, 默认勾不选=显示所有含已完成)
const PROJECT_ALL = '__all__';
const PROJECT_NONE = '__none__';
const VALID_TIME_FILTERS = new Set(['all', 'overdue', 'today', 'week', 'nodue', 'completed']);
const VALID_VIEWS = new Set(['list', 'calendar', 'shopping']);
const DEFAULT_VIEW = 'calendar';   // 打开页面默认进入日历视图 (2026-09-29)
let currentProject = PROJECT_ALL;
let currentTimeFilter = 'all';
let currentView = DEFAULT_VIEW;
let calendarCursor = new Date(); // 日历当前查看的月份（任意一天）
calendarCursor.setDate(1);
let editingId = null;
let creatingProject = false;
let shoppingItems = [];   // 当前列表条目 (2026-08-18 列表系统, 不混入任务)
const SHOPPING_COMPLETED_PAGE_SIZE = 10;
let shoppingCompletedPage = 0;
let listObjects = [];     // 所有可见列表 {id,name,owner,created}
let currentListId = 'shopping';  // 当前选中的列表 id

const SECTION_CONFIG = [
  { key: 'overdue', icon: '▰', label: '过期任务' },
  { key: 'today', icon: '◆', label: '今日到期' },
  { key: 'this_week', icon: '▸', label: '本周到期' },
  { key: 'future', icon: '▭', label: '远期' },
  { key: 'nodue', icon: '∞', label: '无期限' },
];

async function loadTasks() {
  try {
    const res = await fetch('/todo/api/tasks');
    const data = await res.json();
    if (!res.ok) {
      showToast('✗ ' + (data.error || '加载失败'));
      return;
    }
    allTasks = data.tasks;
    completedTasks = data.completed_tasks || [];
    sections = data.sections;
    currentUser = data.current_user || 'alice';
    renderProjectMenu();
    render();
    refreshProjectDatalist();
    loadPersistentProjects();   // 2026-08-12: 持久项目从后端加载 (跨设备)
  } catch (e) {
    showToast('加载失败: ' + e.message);
  }
}

function readViewStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const project = params.get('project');
  currentProject = project === '~none' ? PROJECT_NONE : (project || PROJECT_ALL);
  const time = params.get('time') || 'all';
  currentTimeFilter = VALID_TIME_FILTERS.has(time) ? time : 'all';
  const view = params.get('view') || DEFAULT_VIEW;
  currentView = VALID_VIEWS.has(view) ? view : DEFAULT_VIEW;
  const owner = params.get('owner');
  if (owner === 'mine') { showMine = true; showShared = false; }
  else if (owner === 'shared') { showMine = false; showShared = true; }
  else { showMine = true; showShared = true; }
}

function syncViewUrl(mode = 'push') {
  const params = new URLSearchParams();
  if (currentView !== DEFAULT_VIEW) params.set('view', currentView);
  if (currentProject === PROJECT_NONE) params.set('project', '~none');
  else if (currentProject !== PROJECT_ALL) params.set('project', currentProject);
  if (currentTimeFilter !== 'all') params.set('time', currentTimeFilter);
  // owner 状态: 两亮=默认不写; 只亮一个才写
  if (showMine && !showShared) params.set('owner', 'mine');
  else if (!showMine && showShared) params.set('owner', 'shared');
  const next = window.location.pathname + (params.toString() ? `?${params}` : '');
  history[mode === 'replace' ? 'replaceState' : 'pushState']({}, '', next);
}

function applyView() {
  document.getElementById('viewList').hidden = (currentView !== 'list');
  document.getElementById('viewCalendar').hidden = (currentView !== 'calendar');
  document.getElementById('viewShopping').hidden = (currentView !== 'shopping');
  document.getElementById('viewTabList').setAttribute('aria-selected', currentView === 'list');
  document.getElementById('viewTabCalendar').setAttribute('aria-selected', currentView === 'calendar');
  document.getElementById('viewTabShopping').setAttribute('aria-selected', currentView === 'shopping');
  // 购物视图: 项目/时间 filter-bar 与日历导航都不显示 (无筛选概念)
  const filterBar = document.querySelector('.filter-bar');
  if (filterBar) filterBar.style.display = (currentView === 'shopping') ? 'none' : '';
  // 日历视图: 隐藏项目筛选下拉（2026-08-18: 左上角项目下拉去掉）+ 时间筛选隐藏; list 视图反之
  const projectCell = document.getElementById('filterCellProject');
  if (projectCell) projectCell.style.display = (currentView === 'calendar') ? 'none' : '';
  const timeCell = document.querySelector('.filter-cell-time');
  if (timeCell) timeCell.style.display = (currentView === 'calendar') ? 'none' : '';
  const calNav = document.getElementById('calNavCell');
  if (calNav) calNav.style.display = (currentView === 'calendar') ? '' : 'none';
}

function setView(view) {
  if (!VALID_VIEWS.has(view)) return;
  if (view === currentView) return;
  currentView = view;
  applyView();
  syncViewUrl('push');
  if (view === 'calendar') {
    renderCalendar();
  } else if (view === 'shopping') {
    renderShopping();
  } else {
    // 切回 list 必须重新渲染: deep-link 直接进 calendar/shopping 时 render() 走了
    // 对应分支 return,taskList 从未渲染过,不调 render() 会白屏
    render();
  }
}

function changeCalendarMonth(delta) {
  // delta = -1 (prev) / +1 (next)
  const d = new Date(calendarCursor);
  d.setMonth(d.getMonth() + delta);
  calendarCursor = d;
  renderCalendar();
}

function gotoCalendarToday() {
  calendarCursor = new Date();
  calendarCursor.setDate(1);
  renderCalendar();
}

function applyOwnerScope(tasks) {
  // 后端已按身份过滤（自己+共享），前端按按钮点亮状态再筛
  return tasks.filter(t => {
    const owner = t.owner || currentUser;
    if (owner === 'legacy-agent') return showLegacyAgent;   // legacy-hardware-calendar 日历独立开关 (2026-08-14)
    if (owner === 'shared') return showShared;
    return showMine;
  });
}

function getScopedTasks() {
  let base;
  if (currentProject === PROJECT_ALL) base = [...allTasks];
  else if (currentProject === PROJECT_NONE) base = allTasks.filter(t => !t.project);
  else base = allTasks.filter(t => t.project === currentProject);
  return applyOwnerScope(base);
}

function getScopedCompletedTasks() {
  let base;
  if (currentProject === PROJECT_ALL) base = [...completedTasks];
  else if (currentProject === PROJECT_NONE) base = [];
  else base = completedTasks.filter(t => t.project === currentProject);
  return applyOwnerScope(base);
}

// 日历 view 任务集: 默认显示所有(含已完成); 勾选「仅显示未完成」时只留未完成 (2026-08-18)
function getCalendarTasks() {
  const active = getScopedTasks();
  if (calTodoOnly) return active;   // 勾选「仅显示未完成」→ 只未完成
  const done = getScopedCompletedTasks();
  const seen = new Set(active.map(t => t.id));
  return active.concat(done.filter(t => !seen.has(t.id)));
}

function toggleOwnerScope(scope) {
  // 点亮/熄灭按钮；最少亮一个（不允许全灭）
  const next = { mine: showMine, shared: showShared, legacyAgent: showLegacyAgent };
  next[scope] = !next[scope];
  if (!next.mine && !next.shared && !next.legacyAgent) return;  // 会全灭 → 拒绝
  if (scope === 'mine') showMine = next.mine;
  else if (scope === 'shared') showShared = next.shared;
  else {
    showLegacyAgent = next.legacyAgent;
    localStorage.setItem('todoShowLegacyAgent', showLegacyAgent ? '1' : '0');
  }
  updateOwnerControls();
  syncViewUrl('push');
  render();
}

function updateOwnerControls() {
  const mineBtn = document.getElementById('ownerToggleMine');
  const sharedBtn = document.getElementById('ownerToggleShared');
  const yooBtn = document.getElementById('ownerToggleLegacyAgent');
  if (mineBtn) {
    mineBtn.classList.toggle('active', showMine);
    mineBtn.setAttribute('aria-pressed', showMine ? 'true' : 'false');
  }
  if (sharedBtn) {
    sharedBtn.classList.toggle('active', showShared);
    sharedBtn.setAttribute('aria-pressed', showShared ? 'true' : 'false');
  }
  if (yooBtn) {
    yooBtn.classList.toggle('active', showLegacyAgent);
    yooBtn.setAttribute('aria-pressed', showLegacyAgent ? 'true' : 'false');
  }
}

function taskMatchesTime(task, filter) {
  if (filter === 'all') return true;
  if (filter === 'nodue') return !task.due;
  const sectionKey = filter === 'week' ? 'this_week' : filter;
  return (sections[sectionKey] || []).includes(task.id);
}

function getFilteredTasks(filter = currentTimeFilter) {
  if (filter === 'completed') return getScopedCompletedTasks();
  return getScopedTasks().filter(task => taskMatchesTime(task, filter));
}

function currentProjectLabel() {
  if (currentProject === PROJECT_ALL) return '所有任务';
  if (currentProject === PROJECT_NONE) return '无项目';
  return currentProject;
}

const TIME_FILTER_CONFIG = [
  { key: 'all', label: '全部' },
  { key: 'overdue', label: '▰ 过期' },
  { key: 'today', label: '◆ 今日' },
  { key: 'week', label: '▸ 本周' },
  { key: 'nodue', label: '∞ 无期限' },
  { key: 'completed', label: '✓ 已完成' },
];
const TIME_FILTER_LABEL = Object.fromEntries(TIME_FILTER_CONFIG.map(c => [c.key, c.label]));

function updateViewControls() {
  document.getElementById('projectTriggerLabel').innerHTML = '<span class="y8i y8i-bookmark"></span> ' + escapeHtml(currentProjectLabel());
  document.getElementById('timeTriggerLabel').textContent = TIME_FILTER_LABEL[currentTimeFilter] || '全部';
}

function makeProjectMenuItem(label, count, scope) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'project-menu-item';
  button.setAttribute('role', 'menuitem');
  button.setAttribute('aria-current', currentProject === scope ? 'true' : 'false');
  const name = document.createElement('span');
  name.className = 'project-menu-name';
  name.innerHTML = label;
  const badge = document.createElement('span');
  badge.className = 'project-menu-count';
  badge.textContent = count;
  button.append(name, badge);
  button.addEventListener('click', () => selectProject(scope));
  return button;
}

function renderProjectMenu() {
  const menu = document.getElementById('projectMenu');
  menu.replaceChildren();
  menu.append(makeProjectMenuItem('<span class="y8i y8i-bookmark"></span> 所有任务', allTasks.length, PROJECT_ALL));
  const noProjectCount = allTasks.filter(t => !t.project).length;
  menu.append(makeProjectMenuItem('<span class="y8i y8i-bookmark"></span> 无项目', noProjectCount, PROJECT_NONE));

  const counts = new Map();
  for (const task of allTasks) {
    if (!task.project) continue;
    counts.set(task.project, (counts.get(task.project) || 0) + 1);
  }
  // 2026-08-11: 全完成项目默认隐藏; 只有「持久项目」才继续显示
  const persistent = new Set(getPersistentProjects());
  const completedOnlyProjects = new Map();
  for (const task of completedTasks) {
    if (!task.project || counts.has(task.project)) continue;
    if (!persistent.has(task.project)) continue;   // 非持久: 全部完成 → 隐藏
    completedOnlyProjects.set(task.project, (completedOnlyProjects.get(task.project) || 0) + 1);
  }
  for (const [project, count] of completedOnlyProjects) counts.set(project, count);
  // 持久项目即使名下没有任何任务也一直显示 (2026-08-12)
  for (const proj of persistent) {
    if (!counts.has(proj)) counts.set(proj, 0);
  }
  if (counts.size) {
    const divider = document.createElement('hr');
    divider.className = 'project-menu-divider';
    menu.append(divider);
    for (const [project, count] of [...counts].sort((a, b) => a[0].localeCompare(b[0], 'zh'))) {
      // 项目图标统一 bookmark（2026-09-20 定：不需要 hash，全部用 bookmark）
      menu.append(makeProjectMenuItem(`<span class="y8i y8i-bookmark"></span> ${escapeHtml(project)}`, count, project));
    }
  }

  const create = document.createElement('button');
  create.type = 'button';
  create.className = 'project-menu-item create';
  create.setAttribute('role', 'menuitem');
  create.innerHTML = '<span class="y8i y8i-add"></span> 新建项目';
  create.addEventListener('click', openNewProjectModal);
  menu.append(create);
}
