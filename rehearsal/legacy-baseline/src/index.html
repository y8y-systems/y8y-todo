function getDaysLeft(dueStr) {
  if (!dueStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dueStr + 'T00:00:00');
  const diff = Math.floor((due - today) / (1000*60*60*24));
  return diff;
}

function formatDue(dueStr) {
  if (!dueStr) return '';
  const diff = getDaysLeft(dueStr);
  if (diff < 0) return `过期${-diff}天`;
  if (diff === 0) return '今天到期';
  if (diff === 1) return '明天到期';
  return `剩${diff}天`;
}

function getDueClass(dueStr) {
  if (!dueStr) return '';
  const diff = getDaysLeft(dueStr);
  if (diff < 0) return 'due-overdue';
  if (diff === 0) return 'due-today';
  return '';
}

function getPreview(body, title) {
  if (!body) return '';
  const preview = body.replace(/^#+\s*/gm, '').replace(/[*_~`]/g, '').trim();
  // 2026-08-20: 预览里不重复正文(=标题) —— 如果正文去掉 markdown 后与标题完全相同,
  // 说明 body 只是复制了 title, 则不显示预览, 避免 title 在预览里重复一遍
  if (title && preview === (title || '').trim()) return '';
  return preview;
}

function sortTasksByCompletedDesc(list) {
  list.sort((a, b) => {
    const aDate = a.completed || '';
    const bDate = b.completed || '';
    if (aDate !== bDate) return bDate.localeCompare(aDate);
    return (a.title || '').localeCompare(b.title || '', 'zh');
  });
}

function sortTasksByDueAsc(list) {
  list.sort((a, b) => {
    const aDue = a.due || '9999';
    const bDue = b.due || '9999';
    if (aDue !== bDue) return aDue.localeCompare(bDue);
    return (a.title || '').localeCompare(b.title || '', 'zh');
  });
}

function render() {
  applyView();
  updateViewControls();
  updateOwnerControls();
  renderTimeMenu();

  if (currentView === 'calendar') {
    renderCalendar();
    return;
  }

  if (currentView === 'shopping') {
    renderShopping();
    return;
  }

  const container = document.getElementById('taskList');

  let html = '';
  const tasks = getFilteredTasks();
  if (tasks.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = `✦ ${currentProjectLabel()} · 当前筛选没有任务`;
    container.replaceChildren(empty);
    return;
  }

  if (currentTimeFilter === 'completed') {
    html += `<div class="section">`;
    html += `<div class="section-header completed-section-header"><span class="y8i y8i-check"></span> 已完成 <span class="badge">${tasks.length}</span></div>`;
    html += `<div class="divider"></div>`;
    sortTasksByCompletedDesc(tasks);
    for (const task of tasks) html += renderCard(task, true);
    html += `</div>`;
  } else if (currentTimeFilter === 'all') {
    // 2026-08-20: 主页去掉「过期/今日/本周/远期」桶, 改成按到期日期分组 (升序), 无日期任务单独「无期限」放最后
    const DOW = ['日','一','二','三','四','五','六'];
    const groups = {};   // key: due(YYYY-MM-DD) 或 '__nodue__'
    for (const t of tasks) groups[t.due || '__nodue__'] = (groups[t.due || '__nodue__'] || []).concat(t);
    const keys = Object.keys(groups).filter(k => k !== '__nodue__').sort();  // 日期升序(字符串 YYYY-MM-DD 天然可排序)
    if (groups['__nodue__']) keys.push('__nodue__');  // 无日期放最后
    for (const key of keys) {
      const group = groups[key];
      const firstKey = key === '__nodue__' ? '__nodue__' : key;
      let header;
      if (key === '__nodue__') {
        header = `∞ 无期限 <span class="badge">${group.length}</span>`;
      } else {
        const d = new Date(firstKey + 'T00:00:00');
        const diff = getDaysLeft(firstKey);
        let rel = '';
        if (diff < 0) rel = ` · 过期${-diff}天`;
        else if (diff === 0) rel = ' · 今天';
        else if (diff === 1) rel = ' · 明天';
        else rel = ` · 剩${diff}天`;
        header = `${firstKey.slice(5)} 周${DOW[d.getDay()]}${rel}<span class="badge">${group.length}</span>`;
      }
      html += `<div class="section">`;
      html += `<div class="section-header">${header}</div>`;
      html += `<div class="divider"></div>`;
      sortTasksByDueAsc(group);
      for (const task of group) html += renderCard(task);
      html += `</div>`;
    }
  } else {
    sortTasksByDueAsc(tasks);
    html += `<div class="section">`;
    for (const task of tasks) html += renderCard(task);
    html += `</div>`;
  }

  container.innerHTML = html;
}

function refreshProjectDatalist() {
  const dl = document.getElementById('projectOptions');
  if (!dl) return;
  const counts = new Map();
  for (const t of allTasks) {
    if (!t.project) continue;
    if (t.status !== 'todo') continue;
    counts.set(t.project, (counts.get(t.project) || 0) + 1);
  }
  // 2026-08-11: 全完成且非持久项目不进候选列表
  const persistent = new Set(getPersistentProjects());
  const completedOnly = new Set();
  for (const t of completedTasks) {
    if (!t.project || counts.has(t.project)) continue;
    if (!persistent.has(t.project)) continue;
    completedOnly.add(t.project);
  }
  for (const name of completedOnly) counts.set(name, 0);
  // 持久项目即使名下没有任何任务也进候选 (2026-08-12)
  for (const proj of persistent) {
    if (!counts.has(proj)) counts.set(proj, 0);
  }
  const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  // DOM API 构建, 不用 innerHTML 插值 (y8y §8.4 安全: 项目名是用户输入; 也兼容中文/空格)
  dl.innerHTML = '';
  for (const [name, n] of sorted) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = n > 0 ? `▤ ${name}（${n} 子任务）` : `▤ ${name}（全部完成）`;
    dl.appendChild(opt);
  }
}

function renderCard(task, isCompleted = false) {
  const diff = getDaysLeft(task.due);
  const dueText = formatDue(task.due);
  const dueClass = getDueClass(task.due);
  const preview = getPreview(task.body, task.title);
  const titleText = task.title.replace(/：/g, '：');

  const cardClass = isCompleted ? 'card completed-card' : 'card';
  // 2026-08-11: 卡片外框直接显示任务颜色 (替代左下角小方块)
  const colorClass = ` color-${task.color || 'green'}`;
  // 2026-08-18: 已完成任务也可点击编辑 + checkbox 可 toggle 恢复 (design-note: 日历里能看到勾掉并继续改/toggle回)
  const cardOpen = ` onclick="openEdit('${encodeURIComponent(task.id)}')"`;
  const checkbox = isCompleted
    ? `<div class="checkbox checkbox-done" aria-label="已完成，点击恢复" onclick="event.stopPropagation();unmarkDone('${encodeURIComponent(task.id)}')" title="点击恢复">✓</div>`
    : `<div class="checkbox" onclick="event.stopPropagation();markDone('${encodeURIComponent(task.id)}')" id="cb-${encodeURIComponent(task.id)}"></div>`;
  return `<div class="${cardClass}${colorClass}"${cardOpen}>
    ${checkbox}
    <div class="card-body">
      <div class="card-title">
        <span>${titleText}</span>
      </div>
      ${preview ? `<div class="card-preview">${preview}</div>` : ''}
      <div class="card-meta">
        ${task.due ? `<span class="due-badge ${dueClass}">${dueText}</span>` : ''}
        ${task.due && task.due_end && task.due_end.slice(0,10) > task.due.slice(0,10) ? `<span class="due-badge">↔ ${formatDue(task.due_end)}</span>` : ''}
        ${isCompleted && task.completed ? `<span class="completed-badge"><span class="y8i y8i-check"></span> ${task.completed} 完成</span>` : ''}
        ${task.recurring ? '<span class="recurring-badge"><span class="y8i y8i-recurring"></span> RECUR</span>' : ''}
        ${task.owner === 'shared' ? '<span class="shared-badge"><span class="y8i y8i-bookmark"></span> 共享</span>' : ''}
        ${task.project && currentProject === PROJECT_ALL ? `<span class="project-badge color-${task.color || 'green'}"><span class="y8i y8i-bookmark"></span> ${task.project}</span>` : ''}
      </div>
    </div>
  </div>`;
}

async function markDone(encodedId) {
  const id = decodeURIComponent(encodedId);
  try {
    const res = await fetch(`/todo/api/tasks/${encodeURIComponent(id)}/done`, { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      showToast(data.message === 'Task completed' ? '✓ 已完成' : '↻ 已更新下次日期');
      loadTasks();
    } else {
      showToast('✗ ' + (data.error || '操作失败'));
    }
  } catch (e) {
    showToast('✗ ' + e.message);
  }
}

// 恢复已完成任务为未完成 (2026-08-18: 日历/列表里点到勾掉的✓即 toggle 回来)
async function unmarkDone(encodedId) {
  const id = decodeURIComponent(encodedId);
  try {
    const res = await fetch(`/todo/api/tasks/${encodeURIComponent(id)}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ status: 'todo' }),
    });
    const data = await res.json();
    if (res.ok) {
      showToast('↻ 已恢复为未完成');
      loadTasks();
    } else {
      showToast('✗ ' + (data.error || '恢复失败'));
    }
  } catch (e) {
    showToast('✗ ' + e.message);
  }
}

// ── Calendar View ──
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

// ── 日本祝日 (2026-08-12: 显示在日历日期右侧) ──
// 固定祝日 + 2025-2027 春分/秋分(天文日) + 周一规则; 振替休日按「周日顺延到最近非祝日」计算
const JP_FIXED_HOLIDAYS = [
  ['01-01', '元日'], ['02-11', '建国記念の日'], ['02-23', '天皇誕生日'],
  ['04-29', '昭和の日'], ['05-03', '憲法記念日'], ['05-04', 'みどりの日'],
  ['05-05', 'こどもの日'], ['08-11', '山の日'], ['11-03', '文化の日'],
  ['11-23', '勤労感謝の日'],
];
const JP_MONTH_WEEKDAY = [
  { month: 1, weekday: 1, n: 2, name: '成人の日' },      // 1月第2周一
  { month: 7, weekday: 1, n: 3, name: '海の日' },        // 7月第3周一
  { month: 9, weekday: 1, n: 3, name: '敬老の日' },      // 9月第3周一
  { month: 10, weekday: 1, n: 2, name: 'スポーツの日' }, // 10月第2周一
];
const JP_EQUINOX = {  // 春分/秋分 (日本标准日, 天文计算; 2025-2027 硬编码够用)
  '2025': ['03-20', '09-23'], '2026': ['03-20', '09-23'], '2027': ['03-21', '09-23'],
  '2028': ['03-20', '09-22'], '2024': ['03-20', '09-22'],
};
const jpHolidayCache = {};
function getJpHolidays(year) {
  if (jpHolidayCache[year]) return jpHolidayCache[year];
  const h = new Map();  // 'YYYY-MM-DD' -> 名称
  const y = String(year);
  const add = (mmdd, name) => h.set(`${y}-${mmdd}`, name);
  for (const [mmdd, name] of JP_FIXED_HOLIDAYS) add(mmdd, name);
  const eq = JP_EQUINOX[y];
  if (eq) { add(eq[0], '春分の日'); add(eq[1], '秋分の日'); }
  for (const { month, weekday, n, name } of JP_MONTH_WEEKDAY) {
    const d = new Date(year, month - 1, 1);
    const firstDow = d.getDay();
    let day = 1 + ((weekday - firstDow + 7) % 7) + (n - 1) * 7;
    add(`${pad2(month)}-${pad2(day)}`, name);
  }
  // 振替休日: 祝日落在周日 → 顺延到最近的非祝日
  const keys = [...h.keys()];
  for (const k of keys) {
    const d = new Date(k + 'T00:00:00');
    if (d.getDay() !== 0) continue;
    let next = new Date(d);
    next.setDate(next.getDate() + 1);
    while (h.has(ymd(next))) next.setDate(next.getDate() + 1);
    if (!h.has(ymd(next))) h.set(ymd(next), '振替休日');
  }
  // 国民の休日: 前后两天都是祝日的平日 (如 2026-09-22 夹在敬老の日与秋分の日之间)
  const start = new Date(year, 0, 1), end = new Date(year, 11, 31);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = ymd(d);
    if (h.has(k) || d.getDay() === 0 || d.getDay() === 6) continue;
    const prev = new Date(d); prev.setDate(prev.getDate() - 1);
    const next = new Date(d); next.setDate(next.getDate() + 1);
    if (h.has(ymd(prev)) && h.has(ymd(next))) h.set(k, '国民の休日');
  }
  jpHolidayCache[year] = h;
  return h;
}

// ── 中国法定节假日 (2026-09-23: 与日本祝日同款显示在日期右侧, 只给 alice 看) ──
// 中国的放假安排由国务院逐年公布(含调休连休), 不像日本能靠规则推算 → 逐年硬编码官方通知原文;
// 未收录的年份只标「节日本身」(固定公历日 + 农历节日对应的公历日)。
// 来源: 2025 = 国办发明电〔2024〕12号; 2026 = 国办发明电〔2025〕7号。
const CN_HOLIDAY_SCHEDULE = {
  '2025': {
    ranges: [
      ['01-01', '01-01', '元旦'], ['01-28', '02-04', '春节'], ['04-04', '04-06', '清明节'],
      ['05-01', '05-05', '劳动节'], ['05-31', '06-02', '端午节'], ['10-01', '10-08', '国庆节'],
    ],
    overrides: { '10-06': '中秋节' },   // 2025 国庆中秋连休, 10/6 当天是中秋
    // 调休上班日 (周末补班): 1/26(日)、2/8(六)、4/27(日)、9/28(日)、10/11(六)
    workdays: ['01-26', '02-08', '04-27', '09-28', '10-11'],
  },
  '2026': {
    ranges: [
      ['01-01', '01-03', '元旦'], ['02-15', '02-23', '春节'], ['04-04', '04-06', '清明节'],
      ['05-01', '05-05', '劳动节'], ['06-19', '06-21', '端午节'], ['09-25', '09-27', '中秋节'],
      ['10-01', '10-07', '国庆节'],
    ],
    overrides: {},
    // 调休上班日: 1/4(日)、2/14(六)、2/28(六)、5/9(六)、9/20(日)、10/10(六)
    workdays: ['01-04', '02-14', '02-28', '05-09', '09-20', '10-10'],
  },
};
// 节日本身 (国务院还没公布安排 / 早年年份用): 固定公历日 + 农历节日的公历日
const CN_FESTIVALS = {
  '2024': [['01-01', '元旦'], ['02-10', '春节'], ['04-04', '清明节'], ['05-01', '劳动节'], ['06-10', '端午节'], ['09-17', '中秋节'], ['10-01', '国庆节']],
  '2025': [['01-01', '元旦'], ['01-29', '春节'], ['04-04', '清明节'], ['05-01', '劳动节'], ['05-31', '端午节'], ['10-06', '中秋节'], ['10-01', '国庆节']],
  '2026': [['01-01', '元旦'], ['02-17', '春节'], ['04-05', '清明节'], ['05-01', '劳动节'], ['06-19', '端午节'], ['09-25', '中秋节'], ['10-01', '国庆节']],
  '2027': [['01-01', '元旦'], ['02-06', '春节'], ['04-05', '清明节'], ['05-01', '劳动节'], ['06-09', '端午节'], ['09-15', '中秋节'], ['10-01', '国庆节']],
};
const CN_FIXED_FESTIVALS = [['01-01', '元旦'], ['05-01', '劳动节'], ['10-01', '国庆节']];
const cnHolidayCache = {};
// 返回 { holidays: Map('YYYY-MM-DD'->名称), workdays: Set('YYYY-MM-DD') }
// workdays = 国务院公布的「周末补班日」(调休上班); 没有公布安排的年份为空集 (无法推算)
function getCnYearData(year) {
  if (cnHolidayCache[year]) return cnHolidayCache[year];
  const holidays = new Map();
  const workdays = new Set();
  const y = String(year);
  const sch = CN_HOLIDAY_SCHEDULE[y];
  if (sch) {
    for (const [from, to, name] of sch.ranges) {
      const d = new Date(`${y}-${from}T00:00:00`);
      const last = new Date(`${y}-${to}T00:00:00`);
      while (d <= last) { holidays.set(ymd(d), name); d.setDate(d.getDate() + 1); }
    }
    for (const [mmdd, name] of Object.entries(sch.overrides || {})) holidays.set(`${y}-${mmdd}`, name);
    for (const mmdd of (sch.workdays || [])) workdays.add(`${y}-${mmdd}`);
  } else {
    for (const [mmdd, name] of (CN_FESTIVALS[y] || CN_FIXED_FESTIVALS)) holidays.set(`${y}-${mmdd}`, name);
  }
  const data = { holidays, workdays };
  cnHolidayCache[year] = data;
  return data;
}
// 中国节假日/调休上班日只给 alice 看 —— bob拿到的永远是空表 (2026-09-23 要求)
function cnHolidaysFor(year) {
  return currentUser === 'alice' ? getCnYearData(year).holidays : new Map();
}
function cnWorkdaysFor(year) {
  return currentUser === 'alice' ? getCnYearData(year).workdays : new Set();
}

function renderCalendar() {
  const titleEl = document.getElementById('calTitle');
  const gridEl = document.getElementById('calendarGrid');
  if (!titleEl || !gridEl) return;

  const year = calendarCursor.getFullYear();
  const month = calendarCursor.getMonth();
  titleEl.textContent = `${year} · ${pad2(month + 1)}`;

  // 当前月第一天 / 视图网格起点（周一为一周开始, 2026-08-12 由周日改）
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(firstOfMonth.getDate() - ((firstOfMonth.getDay() + 6) % 7));

  const todayStr = ymd(new Date());

  // 任务按覆盖日期聚合（YYYY-MM-DD → [task]）；跨天任务(due_end)展开到每一天；过滤掉无 due
  const byDay = new Map();
  const addToDay = (key, task) => {
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(task);
  };
  for (const t of getCalendarTasks()) {   // 日历开关: 可含已完成 (2026-08-18)
    if (!t.due) continue;
    const start = t.due.slice(0, 10);
    const end = t.due_end && t.due_end.slice(0, 10) > start ? t.due_end.slice(0, 10) : start;
    let cur = new Date(start + 'T00:00:00');
    const last = new Date(end + 'T00:00:00');
    while (cur <= last) {
      addToDay(ymd(cur), t);
      cur.setDate(cur.getDate() + 1);
    }
  }
  // 按截止时间排序（时间早的优先）
  for (const list of byDay.values()) {
    list.sort((a, b) => {
      const at = a.due_time || '';
      const bt = b.due_time || '';
      return at.localeCompare(bt);
    });
  }

  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const isOut = d.getMonth() !== month;
    const key = ymd(d);
    const dayTasks = byDay.get(key) || [];
    const isToday = key === todayStr;
    cells.push({ date: d, key, isOut, isToday, dayTasks });
  }

  // 分离跨天任务：它们不再每天重复显示 chip，而是渲染成横跨多列的 bar（名字只显示一次）
  const isSpan = (t) => t.due_end && t.due_end.slice(0, 10) > t.due.slice(0, 10);
  const spanTasks = new Map();  // task.id → { task, startIdx, endIdx }
  const cellHasSpan = new Set();  // 被 bar 覆盖的 cell index → 单日任务下移避让

  const MAX_PER_CELL = 4;  // 2026-08-12: 3→4, 行高加大后每格显示更多
  gridEl.replaceChildren();

  // 第一遍：算出跨天任务在网格内的起止 index（YYYY-MM-DD 字典序 = 日期序）
  const keys = cells.map(c => c.key);
  const firstKey = keys[0], lastKey = keys[41];
  for (const t of getCalendarTasks()) {   // 跨天任务也用日历开关集 (2026-08-18)
    if (!t.due || !isSpan(t)) continue;
    const start = t.due.slice(0, 10);
    const end = t.due_end.slice(0, 10);
    if (end < firstKey || start > lastKey) continue;  // 完全在当前网格外
    const startIdx = start <= firstKey ? 0 : keys.findIndex(k => k >= start);
    const endIdx = end >= lastKey ? 41 : keys.findIndex(k => k > end) - 1;
    if (startIdx < 0 || endIdx < startIdx) continue;
    spanTasks.set(t.id, { task: t, startIdx, endIdx });
    for (let i = startIdx; i <= endIdx; i++) cellHasSpan.add(i);
  }

  // 第二遍：渲染格子（显式 grid 定位，防止 bar 参与自动排布打乱顺序）
  for (let i = 0; i < 42; i++) {
    const cell = cells[i];
    const cellEl = document.createElement('div');
    cellEl.className = 'cal-cell';
    if (cell.isOut) cellEl.classList.add('cal-out');
    if (cell.isToday) cellEl.classList.add('cal-today');
    if (cellHasSpan.has(i)) cellEl.classList.add('cal-cell-has-span');
    cellEl.style.gridColumn = String((i % 7) + 1);
    cellEl.style.gridRow = String(Math.floor(i / 7) + 1);
    cellEl.dataset.date = cell.key;   // 拖拽改期的落点标识 (2026-09-16)

    const dayNum = document.createElement('div');
    dayNum.className = 'cal-day-num';
    dayNum.textContent = String(cell.date.getDate());
    cellEl.appendChild(dayNum);
    // 日本祝日显示在日期右侧 (2026-08-12) + 格子淡粉背景; 周日粉层; 周六淡蓝 (2026-08-12)
    // 中国法定节假日: 淡黄底 + 节日名, 只有 alice 看得到; 调休上班日挂「班」标签 (2026-09-23)
    const isSunday = cell.date.getDay() === 0;
    const isSaturday = cell.date.getDay() === 6;
    const holidayName = getJpHolidays(cell.date.getFullYear()).get(cell.key);
    const cnHolidayName = cnHolidaysFor(cell.date.getFullYear()).get(cell.key);
    // 调休上班的那天其实是工作日 → 不涂周末底色(周六蓝/周日粉), 以免和「班」标签打架
    const isCnWorkday = cnWorkdaysFor(cell.date.getFullYear()).has(cell.key);
    const showCnHoliday = !!cnHolidayName && !isCnWorkday;

    if (isSaturday && !isCnWorkday) cellEl.classList.add('cal-saturday-cell');
    // 日本祝日永远保留(那是真节日); 周日粉层 / 中国节假日遇调休上班则让位
    if (holidayName || ((showCnHoliday || isSunday) && !isCnWorkday)) {
      cellEl.classList.add('cal-holiday-cell');
      for (const [nm, cls] of [[holidayName, 'cal-holiday'], [showCnHoliday ? cnHolidayName : null, 'cal-holiday']]) {
        if (!nm) continue;
        const tag = document.createElement('span');
        tag.className = cls;
        tag.textContent = nm;
        tag.title = nm;
        dayNum.appendChild(tag);
      }
    }
    // 中国节假日淡黄底 (放在周末/祝日底色规则之后 → 撞周六周日时黄底覆盖)
    if (showCnHoliday) cellEl.classList.add('cal-cn-holiday-cell');
    if (isCnWorkday) {
      const tag = document.createElement('span');
      tag.className = 'cal-workday';
      tag.textContent = '班';
      tag.title = '调休上班日（周末补班）';
      dayNum.appendChild(tag);
    }

    const list = document.createElement('div');
    list.className = 'cal-tasks';
    // 只显示单日任务（跨天任务由 bar 表示）
    const dayOnly = cell.dayTasks.filter(t => !isSpan(t));
    const visible = dayOnly.slice(0, MAX_PER_CELL);
    for (const task of visible) {
      const item = document.createElement('div');
      // 已完成任务弱化显示 (2026-08-18: 日历显示已完成开关开启时)
      const doneCls = task.status === 'done' || task.completed ? ' cal-task-done' : '';
      item.className = `cal-task color-${task.color || 'green'}${doneCls}`;  // 竖条颜色 = 自选颜色
      item.title = `${task.title} · ${task.due}${task.due_end ? ' → ' + task.due_end : ''}${task.due_time ? ' ' + task.due_time : ''} · ${task.color || 'green'}`;
      // 拖拽改期用 (2026-09-16): 单日 chip 带任务 id + 当前日期
      item.dataset.taskId = task.id;
      item.dataset.date = task.due.slice(0, 10);
      // 不在这里绑 onclick —— 点击 chip 冒泡到 cell,统一打开当日 drawer;
      // 任务内容在 drawer 里点卡片再打开 (openEdit)

      const titleSpan = document.createElement('span');
      titleSpan.className = 'cal-task-title';
      titleSpan.textContent = task.title;
      item.appendChild(titleSpan);
      // 项目名淡灰小字跟在标题后, 硬截断 (2026-08-12)
      if (task.project) {
        const projSpan = document.createElement('span');
        projSpan.className = 'cal-task-project';
        projSpan.textContent = task.project;
        projSpan.title = task.project;
        item.appendChild(projSpan);
      }

      list.appendChild(item);
    }
    const overflow = dayOnly.length - visible.length;
    if (overflow > 0) {
      const more = document.createElement('div');
      more.className = 'cal-more';
      more.textContent = `+${overflow} 更多`;
      more.onclick = (ev) => {
        ev.stopPropagation();
        openDayDrawer(cell.key);
      };
      list.appendChild(more);
    }
    cellEl.appendChild(list);
    // 点格子任意位置（含 chip / +N 更多）→ 打开当日 drawer,不直接进任务内容
    cellEl.addEventListener('click', () => {
      openDayDrawer(cell.key);
    });
    gridEl.appendChild(cellEl);
  }

  // 第三遍：渲染跨天横条（名字只显示一次；跨周分段，续段只显示延续箭头）
  // 名字位置：优先显示在「今天」所在的段（今天在任务范围内时），否则显示在开始段
  for (const { task, startIdx, endIdx } of spanTasks.values()) {
    let s = startIdx;
    // 找名字该放哪一段：含今天的段优先，否则第一段
    let nameRow = null;
    if (todayStr >= task.due.slice(0, 10) && todayStr <= task.due_end.slice(0, 10)) {
      const todayIdx = keys.findIndex(k => k >= todayStr);
      if (todayIdx >= startIdx && todayIdx <= endIdx) {
        nameRow = Math.floor(todayIdx / 7);
      }
    }
    while (s <= endIdx) {
      const row = Math.floor(s / 7);
      const rowEnd = Math.min(row * 7 + 6, endIdx);
      const segStart = s;   // 修复闭包陷阱: s 是外层 let, 循环结束后变 endIdx+1, 必须复制当前段起点
      const isNameSegment = (row === nameRow) || (nameRow === null && s === startIdx);
      const bar = document.createElement('div');
      // 2026-08-18: 跨天已完成任务横条也弱化显示
      const spanDoneCls = (task.status === 'done' || task.completed) ? ' cal-span-bar-done' : '';
      bar.className = `cal-span-bar color-${task.color || 'green'}${spanDoneCls}`;
      if (!isNameSegment) bar.classList.add('cal-span-bar-cont');
      bar.style.gridColumn = `${(segStart % 7) + 1} / ${(rowEnd % 7) + 2}`;
      bar.style.gridRow = String(row + 1);
      bar.title = `${task.title} · ${task.due} → ${task.due_end}${task.due_time ? ' ' + task.due_time : ''}`;
      if (isNameSegment) {
        const txt = document.createElement('span');
        txt.textContent = task.title;
        bar.appendChild(txt);
        // 2026-09-20：跨天横条上不再显示 bookmark（「共享」标记已移除，
        // 横条本身有颜色/标题，图标在细条里只会挤占文字空间）。
      } else {
        bar.textContent = '↳';
      }
      bar.addEventListener('click', (ev) => {
        ev.stopPropagation();
        // 点击横条 → 打开「当天」任务列表（drawer），不进编辑；
        // 用点击 x 坐标算出落在本段第几列 → 对应日期（2026-08-11 修复）
        const rect = bar.getBoundingClientRect();
        const frac = rect.width > 0 ? (ev.clientX - rect.left) / rect.width : 0;
        const cols = rowEnd - segStart + 1;               // 本段覆盖的列数
        const colOffset = Math.max(0, Math.min(cols - 1, Math.floor(frac * cols)));
        const dayKey = cells[segStart + colOffset].key;
        openDayDrawer(dayKey);
      });
      gridEl.appendChild(bar);
      s = rowEnd + 1;
    }
  }

  initCalendarDrag();   // 幂等: 拖拽改期监听 (2026-09-16)
}

// ══════════════════════════════════════════════════════════════
// 日历任务拖拽改期 (2026-09-16 v1)
//   桌面: 按住移动超过阈值即开始拖
//   手机: 长按 220ms 进入拖拽 (否则会和页面滚动打架)
//   落点: PUT /todo/api/tasks/<id> {due} → 失败重绘回滚, 成功给可点击撤销的 toast
//   范围: 单日 chip (含已完成 chip, 2026-09-20 起); 跨天 bar 与边缘自动翻月属 v1.5/v2
//   已完成 chip: 只改 due(计划日期), done/<归档日>/ 目录不动 (后端 done 分支支持)
//   2026-09-20 (design-note「拖完有延迟」): 改成乐观 UI —— 松手立即本地落位(不等网络),
//     PUT 后台跑, 同一任务串行化; 成功后不再整轮 loadTasks(), 只延后静默对账。
// ══════════════════════════════════════════════════════════════
const CAL_DRAG_LONGPRESS_MS = 220;
const CAL_DRAG_THRESHOLD_PX = 6;

let calDrag = null;                // 当前拖拽会话
let calDragSuppressClick = false;  // 拖完吞掉一次 click (否则会弹出当日 drawer)

function initCalendarDrag() {
  const gridEl = document.getElementById('calendarGrid');
  if (!gridEl || gridEl._calDragBound) return;
  gridEl._calDragBound = true;
  gridEl.addEventListener('pointerdown', calDragPointerDown);
  gridEl.addEventListener('pointermove', calDragPointerMove);
  gridEl.addEventListener('pointerup', calDragPointerUp);
  gridEl.addEventListener('pointercancel', calDragPointerUp);
  // 长按进入拖拽后, 只有拦掉 touchmove 才能真正阻止页面跟着滚
  gridEl.addEventListener('touchmove', (ev) => {
    if (calDrag && calDrag.active) ev.preventDefault();
  }, { passive: false });
  // 拖动结束紧随其后的 click 一律吞掉 (capture 阶段, 早于格子的 drawer 逻辑)
  document.addEventListener('click', (ev) => {
    if (!calDragSuppressClick) return;
    calDragSuppressClick = false;
    // ⚠️ 2026-09-20 修复: 只吞「落在日历网格里」的那次尾随 click。
    // 原来是无条件吞掉「下一次任意点击」 —— 拖完去点 toast 的「点此撤销」或新建/切视图
    // 按钮时, 那第一下会被吃掉(表现为点了没反应, 要再点一次)。
    const inGrid = ev.target && ev.target.closest ? ev.target.closest('#calendarGrid') : null;
    if (!inGrid) return;                 // 网格外的点击照常放行 (标志已清, 不会赖着)
    ev.stopPropagation();
    ev.preventDefault();
  }, true);
}

function calDragPointerDown(ev) {
  if (typeof currentView !== 'undefined' && currentView !== 'calendar') return;
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  const chip = ev.target && ev.target.closest ? ev.target.closest('.cal-task') : null;
  if (!chip || !chip.dataset.taskId) return;
  // 已完成任务同样可拖 (2026-09-20 修复): 只改 due, 不动 done/ 归档日期

  calDragSuppressClick = false;
  calDrag = {
    chip,
    pointerId: ev.pointerId,
    pointerType: ev.pointerType,
    startX: ev.clientX,
    startY: ev.clientY,
    taskId: chip.dataset.taskId,
    fromDate: chip.dataset.date,
    active: false,
    timer: null,
    ghost: null,
    targetCell: null,
  };
  if (ev.pointerType !== 'mouse') {
    calDrag.timer = setTimeout(calDragArm, CAL_DRAG_LONGPRESS_MS);
  }
}

function calDragArm() {
  if (!calDrag || calDrag.active) return;
  calDrag.active = true;
  clearTimeout(calDrag.timer);
  calDrag.timer = null;
  const chip = calDrag.chip;
  chip.classList.add('cal-drag-armed', 'cal-task-dragging');
  try { chip.setPointerCapture(calDrag.pointerId); } catch (e) {}
  const ghost = document.createElement('div');
  ghost.className = 'cal-drag-ghost';
  const t = chip.querySelector('.cal-task-title');
  ghost.textContent = t ? t.textContent : chip.textContent;
  document.body.appendChild(ghost);
  calDrag.ghost = ghost;
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
}

function calDragPointerMove(ev) {
  if (!calDrag || ev.pointerId !== calDrag.pointerId) return;
  const dx = ev.clientX - calDrag.startX;
  const dy = ev.clientY - calDrag.startY;
  if (!calDrag.active) {
    if (Math.hypot(dx, dy) <= CAL_DRAG_THRESHOLD_PX) return;
    if (calDrag.pointerType !== 'mouse') { calDragAbort(); return; }  // 手机没长按就移动 = 用户在滚动
    calDragArm();
  }
  if (!calDrag.active) return;
  if (ev.cancelable) ev.preventDefault();
  if (calDrag.ghost) {
    calDrag.ghost.style.left = ev.clientX + 'px';
    calDrag.ghost.style.top = ev.clientY + 'px';
  }
  const cell = calCellFromPoint(ev.clientX, ev.clientY);
  if (cell !== calDrag.targetCell) {
    if (calDrag.targetCell) calDrag.targetCell.classList.remove('cal-drop-target');
    calDrag.targetCell = cell;
    if (cell) cell.classList.add('cal-drop-target');
  }
  const isSame = !cell || cell.dataset.date === calDrag.fromDate;
  if (calDrag.ghost) calDrag.ghost.classList.toggle('is-same', isSame);
}

function calCellFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el || !el.closest) return null;
  const cell = el.closest('.cal-cell');
  return (cell && cell.dataset.date) ? cell : null;   // 落在日历外 → 无有效落点
}

function calDragPointerUp(ev) {
  if (!calDrag || ev.pointerId !== calDrag.pointerId) return;
  const wasActive = calDrag.active;
  const taskId = calDrag.taskId;
  const fromDate = calDrag.fromDate;
  const cell = calDrag.targetCell;
  const toDate = cell ? cell.dataset.date : '';
  calDragTeardown();
  if (!wasActive) return;                 // 普通点击 → 交回格子的 drawer 逻辑
  calDragSuppressClick = true;
  // 尾随 click 只会毫秒级到达; 超过窗口就作废, 免得标志赖着吃掉后续无关点击 (2026-09-20)
  setTimeout(() => { calDragSuppressClick = false; }, 600);
  if (!toDate || toDate === fromDate) { renderCalendar(); return; }   // 原位 / 无效落点
  calDragCommit(taskId, toDate, fromDate);
}

function calDragAbort() { calDragTeardown(); renderCalendar(); }

function calDragTeardown() {
  if (!calDrag) return;
  clearTimeout(calDrag.timer);
  const chip = calDrag.chip;
  if (chip) {
    chip.classList.remove('cal-drag-armed', 'cal-task-dragging');
    try { chip.releasePointerCapture(calDrag.pointerId); } catch (e) {}
  }
  if (calDrag.targetCell) calDrag.targetCell.classList.remove('cal-drop-target');
  if (calDrag.ghost) calDrag.ghost.remove();
  calDrag = null;
}

// 同一任务的提交串行化: 慢网络下连续拖拽时, 防止两个 PUT 乱序落库(最终 due 变旧值)
const calTaskChains = new Map();

function calTaskChain(taskId, fn) {
  const prev = calTaskChains.get(taskId) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  calTaskChains.set(taskId, next);
  next.catch(() => {}).finally(() => {
    if (calTaskChains.get(taskId) === next) calTaskChains.delete(taskId);
  });
  return next;
}

// 乐观更新: 直接改内存里那条任务的 due (日历/列表都按内存渲染)
function applyTaskDueLocal(taskId, due) {
  const t = allTasks.find(x => x.id === taskId) || completedTasks.find(x => x.id === taskId);
  if (t) { t.due = due; return true; }
  return false;
}

// 后台静默对账 (2026-09-20): 界面已按乐观状态渲染完, 这里才把服务端真值
// (尤其 sections 分桶) 拉回来 —— 不 await、不参与手感; 拖拽中就推迟, 免得重绘打断手势。
function calSilentReconcile(attempt = 0) {
  if (calDrag && calDrag.active) {
    if (attempt < 25) setTimeout(() => calSilentReconcile(attempt + 1), 400);
    return;
  }
  loadTasks();
}

function calPutDue(taskId, due) {
  return fetch(`/todo/api/tasks/${encodeURIComponent(taskId)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ due }),
  });
}

// 拖拽改期提交: 松手先本地落位(6ms 到位), PUT 走后台; 失败/异常自动还原并提示。
function calDragCommit(taskId, toDate, fromDate) {
  applyTaskDueLocal(taskId, toDate);
  renderCalendar();                        // ← 手感就在这里: 不等网络
  calTaskChain(taskId, async () => {
    try {
      const res = await calPutDue(taskId, toDate);
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        applyTaskDueLocal(taskId, fromDate);
        renderCalendar();
        showToast('✗ ' + (data.error || '改期失败') + ' · 已还原');
        return;
      }
      showUndoToast(`✓ 已移到 ${toDate}`, () => calUndoDue(taskId, toDate, fromDate));
    } catch (e) {
      applyTaskDueLocal(taskId, fromDate);
      renderCalendar();
      showToast('✗ 改期失败: ' + e.message + ' · 已还原');
    } finally {
      calSilentReconcile();
    }
  });
}

// 撤销: 同样是乐观的 (点击即回位), 后台回滚
function calUndoDue(taskId, toDate, backDate) {
  applyTaskDueLocal(taskId, backDate);
  renderCalendar();
  calTaskChain(taskId, async () => {
    try {
      const res = await calPutDue(taskId, backDate);
      if (res.ok) {
        showToast('↺ 已撤销, 回到 ' + backDate);
      } else {
        applyTaskDueLocal(taskId, toDate);
        renderCalendar();
        showToast('✗ 撤销失败 · 已还原');
      }
    } catch (e) {
      applyTaskDueLocal(taskId, toDate);
      renderCalendar();
      showToast('✗ 撤销失败: ' + e.message);
    } finally {
      calSilentReconcile();
    }
  });
}

// ── Day Drawer (centered pixel modal showing all tasks for a clicked day) ──
const WEEKDAY_NAMES_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
let currentDrawerDay = null;  // 当前抽屉对应的 YYYY-MM-DD,供「＋ 添加任务」预填

function openDayDrawer(dayKey) {
  // dayKey: 'YYYY-MM-DD'
  currentDrawerDay = dayKey;  // 供「＋ 添加任务」预填日期
  const overlay = document.getElementById('dayDrawerOverlay');
  const titleEl = document.getElementById('dayDrawerTitle');
  const bodyEl = document.getElementById('dayDrawerBody');
  if (!overlay || !titleEl || !bodyEl) return;

  // 解析日期
  const [y, m, d] = dayKey.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const weekday = WEEKDAY_NAMES_CN[date.getDay()];

  // 取日历任务集（默认未完成；开启「显示已完成」时含已完成）覆盖该天的任务（跨天 due ≤ day ≤ due_end 也算）
  const tasks = getCalendarTasks()
    .filter(t => {
      if (!t.due) return false;
      const start = t.due.slice(0, 10);
      const end = t.due_end && t.due_end.slice(0, 10) > start ? t.due_end.slice(0, 10) : start;
      return dayKey >= start && dayKey <= end;
    })
    .sort((a, b) => {
      const po = { high: 0, medium: 1, low: 2 };
      const p = (po[a.priority] ?? 1) - (po[b.priority] ?? 1);
      if (p !== 0) return p;
      return (a.due_time || '').localeCompare(b.due_time || '');
    });

  // 头部: 2026·07·23 周四 · 2 项
  titleEl.innerHTML = '';
  const dateSpan = document.createElement('span');
  dateSpan.textContent = `${dayKey} ${weekday}`;
  titleEl.appendChild(dateSpan);
  const countSpan = document.createElement('span');
  countSpan.className = 'count';
  countSpan.textContent = `· ${tasks.length} 项`;
  titleEl.appendChild(countSpan);

  // body: 复用 renderCard 渲染每个任务;空就显示空状态
  bodyEl.innerHTML = '';
  if (tasks.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'day-drawer-empty';
    empty.textContent = '✦ 当日没有任务';
    bodyEl.appendChild(empty);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'day-drawer-list';
    for (const task of tasks) {
      // renderCard 返回 HTML 字符串, 用临时容器转 DOM
      // 2026-08-18: 已完成任务按状态渲染 (显示✓勾掉, 可点开编辑/恢复)
      const isDone = task.status === 'done' || task.completed || task.folder === 'done';
      const tmp = document.createElement('div');
      tmp.innerHTML = renderCard(task, isDone);
      const card = tmp.firstElementChild;
      // 卡片本体(非checkbox)点击 → 开编辑 + 关抽屉 (checkbox 已 stopPropagation)
      card.addEventListener('click', closeDayDrawer);
      wrap.appendChild(card);
    }
    bodyEl.appendChild(wrap);
  }

  overlay.classList.add('open');
}

function closeDayDrawer() {
  const overlay = document.getElementById('dayDrawerOverlay');
  if (overlay) overlay.classList.remove('open');
}

function renderShopping() {
  const container = document.getElementById('shoppingList');
  if (!container) return;
  const todos = shoppingItems.filter(i => i.status !== 'done');
  const dones = shoppingItems.filter(i => i.status === 'done');
  const completedPageCount = Math.max(1, Math.ceil(dones.length / SHOPPING_COMPLETED_PAGE_SIZE));
  shoppingCompletedPage = Math.min(shoppingCompletedPage, completedPageCount - 1);
  const completedStart = shoppingCompletedPage * SHOPPING_COMPLETED_PAGE_SIZE;
  const visibleDones = dones.slice(completedStart, completedStart + SHOPPING_COMPLETED_PAGE_SIZE);
  const clearRow = document.getElementById('shoppingClearRow');
  if (clearRow) clearRow.hidden = dones.length === 0;

  let html = '';
  if (shoppingItems.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = '☐ 列表是空的，加点什么吧';
    container.replaceChildren(empty);
    return;
  }

  if (todos.length > 0) {
    html += `<div class="section"><div class="section-header">☐ 未完成 <span class="badge">${todos.length}</span></div><div class="divider"></div>`;
    for (const item of todos) html += renderShoppingItem(item);
    html += `</div>`;
  }
  if (dones.length > 0) {
    const prevDisabled = shoppingCompletedPage === 0 ? ' disabled' : '';
    const nextDisabled = shoppingCompletedPage >= completedPageCount - 1 ? ' disabled' : '';
    html += `<div class="section"><div class="section-header">✓ 已完成 <span class="badge">${dones.length}</span><div class="shopping-completed-controls"><button type="button" class="btn shopping-completed-nav y8y-btn" onclick="changeShoppingCompletedPage(-1)"${prevDisabled}>‹ 上10条</button><span class="shopping-completed-page">${shoppingCompletedPage + 1} / ${completedPageCount} 页</span><button type="button" class="btn shopping-completed-nav y8y-btn" onclick="changeShoppingCompletedPage(1)"${nextDisabled}>下10条 ›</button></div></div><div class="divider"></div>`;
    for (const item of visibleDones) html += renderShoppingItem(item, true);
    html += `</div>`;
  }
  container.innerHTML = html;
}

function changeShoppingCompletedPage(delta) {
  const doneCount = shoppingItems.filter(i => i.status === 'done').length;
  const pageCount = Math.max(1, Math.ceil(doneCount / SHOPPING_COMPLETED_PAGE_SIZE));
  shoppingCompletedPage = Math.max(0, Math.min(pageCount - 1, shoppingCompletedPage + delta));
  renderShopping();
}

function renderShoppingItem(item, isDone = false) {
  const id = encodeURIComponent(item.id);
  const title = escapeHtml(item.title);
  const doneCls = isDone ? ' shopping-item-done' : '';
  return `<div class="shopping-item${doneCls}">
    <span class="shopping-name"${isDone ? '' : ` onclick="editShoppingItem('${id}')"`} title="${isDone ? '' : '点击编辑'}">${title}</span>
    <button type="button" class="shopping-check" onclick="toggleShoppingItem('${id}', ${isDone ? 'false' : 'true'})"
      aria-label="${isDone ? '恢复为待购' : '标记已购'}" aria-pressed="${isDone ? 'true' : 'false'}" title="toggle">${isDone ? '<span class="y8i y8i-check"></span>' : ''}</button>
    <button type="button" class="shopping-copy" onclick="copyShoppingItem('${id}')" aria-label="复制全文" title="复制全文"><span class="y8i y8i-copy"></span></button>
    <button type="button" class="shopping-edit" onclick="editShoppingItem('${id}')" aria-label="编辑此条目" title="编辑"><span class="y8i y8i-edit"></span></button>
    <button type="button" class="shopping-del" onclick="deleteShoppingItem('${id}')" aria-label="删除此条目" title="删除"><span class="y8i y8i-trash"></span></button>
  </div>`;
}

// 一键复制条目全文到剪贴板 (2026-08-20) — 从 shoppingItems 取原始 title, 避免 escapeHtml 转义污染
function copyShoppingItem(encodedId) {
  const id = decodeURIComponent(encodedId);
  const item = shoppingItems.find(i => i.id === id);
  const text = item ? item.title : '';
  const done = () => { showToast('✓ 已复制'); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { showToast('复制失败: ' + e.message); }
  document.body.removeChild(ta);
}

// Modal functions
const VALID_COLORS_JS = ['yellow', 'green', 'pink', 'purple', 'orange', 'red', 'blue', 'cyan'];
let selectedColor = 'green';
let userTouchedColor = false;   // 新建时用户是否手动点过色块 → 手动选过就尊重用户, 不联动项目色 (2026-08-23)
function setColorPicker(color) {
  selectedColor = VALID_COLORS_JS.includes(color) ? color : 'green';
  document.querySelectorAll('#inputColor .color-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.dataset.color === selectedColor);
    sw.setAttribute('aria-checked', sw.dataset.color === selectedColor ? 'true' : 'false');
  });
}
function getSelectedColor() { return selectedColor; }
// 取某项目已有任务的颜色 (多数票; todo 优先, 回退 completion) —— 供「新建选已有项目→自动继承项目色」联动 (2026-08-23)
function getProjectColor(project) {
  if (!project) return null;
  const tally = (arr) => {
    const v = {};
    let best = null, bestN = 0;
    for (const t of arr) {
      if (t.project !== project) continue;
      const c = t.color && VALID_COLORS_JS.includes(t.color) ? t.color : 'green';
      v[c] = (v[c] || 0) + 1;
      if (v[c] > bestN) { best = c; bestN = v[c]; }
    }
    return best;
  };
  const todoColor = tally(allTasks.filter(t => t.status === 'todo'));
  return todoColor || tally(allTasks) || tally(completedTasks) || null;
}
// 新建任务时: 若项目框填了已有项目且用户没手动改色 → 把色块联动成该项目颜色
function syncProjectColor() {
  if (editingId || userTouchedColor) return;   // 编辑不联动; 手动选过色尊重用户
  const proj = document.getElementById('inputProject').value.trim();
  const pc = getProjectColor(proj);
  if (pc) setColorPicker(pc);
}
// 色块点击选择 (事件绑定在 init 区)
function openModal(title, task, options = {}) {
  editingId = task ? task.id : null;
  creatingProject = Boolean(options.creatingProject);
  userTouchedColor = false;   // 每次打开重置手动改色标记 (2026-08-23)
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('inputTitle').value = task ? task.title : '';
  document.getElementById('inputDue').value = task && task.due ? task.due : (options.due || ymd(new Date()));
  document.getElementById('inputDueEnd').value = task && task.due_end ? task.due_end : '';
  document.getElementById('inputDueTime').value = task && task.due_time ? task.due_time : '';
  setColorPicker(task ? (task.color || 'green') : (localStorage.getItem('todoColorDefault') || 'green'));
  const ownerSel = document.getElementById('inputOwner');
  if (ownerSel) {
    // 新建任务: 用持久化的上次选择 (localStorage); 编辑: 用任务自己的归属
    if (task) {
      // 编辑: 用任务自己的归属 (legacy-agent 任务保持 legacy-agent, 2026-08-15)
      ownerSel.value = task.owner === 'shared' ? 'shared'
                     : task.owner === 'legacy-agent' ? 'legacy-agent'
                     : 'me';
    } else {
      let lastOwner = 'me';
      try { lastOwner = localStorage.getItem('todoOwnerDefault') || 'me'; } catch(e) {}
      ownerSel.value = lastOwner === 'shared' ? 'shared'
                     : lastOwner === 'legacy-agent' ? 'legacy-agent'
                     : 'me';
    }
  }
  document.getElementById('inputContent').value = task && task.body && task.body !== task.title ? task.body : '';
  // 内容预览/编辑模式 (2026-08-13 方案A): 编辑已有任务默认预览渲染; 新建默认编辑
  setContentMode(task ? 'preview' : 'edit');
  // 新建任务: 恢复上次未保存的草稿 (2026-08-11 自动保存)
  if (!task) {

  }
  const activeProject = currentProject !== PROJECT_ALL && currentProject !== PROJECT_NONE ? currentProject : '';
  document.getElementById('inputProject').value = task ? (task.project || '') : (options.project ?? activeProject);
  // 新建任务: 预填项目已有色 → 立即联动色块 (2026-08-23)

  const actions = document.getElementById('modalActions');

      <button class="btn btn-danger y8y-btn y8y-btn-danger" onclick="deleteTask()">删除</button>
      <button class="btn btn-cancel y8y-btn y8y-btn-ghost" onclick="closeModal()">取消</button>

      <button class="btn btn-primary y8y-btn y8y-btn-primary" onclick="saveTask()">保存</button>
    `;
  }

  document.getElementById('modalOverlay').classList.add('open');
  document.body.classList.add('modal-locked');   // 2026-08-18: 锁定背景滚动, 防穿透

async function saveTask() {
  const title = document.getElementById('inputTitle').value.trim();
  if (!title) { showToast('请输入标题'); return; }

  const due = document.getElementById('inputDue').value;
  const due_end = document.getElementById('inputDueEnd').value;
  // 结束日期必须 ≥ 截止日期，否则提示
  if (due && due_end && due_end < due) {
    showToast('结束日期不能早于截止日期');
    return;
  }
  const due_time = document.getElementById('inputDueTime').value;
  const color = getSelectedColor();
  // 持久化颜色选择: 下次新建默认用上次选的 (2026-08-11)
  try {
    localStorage.setItem('todoColorDefault', color || 'green');
  } catch(e) {}
  const ownerSel = document.getElementById('inputOwner');
  // 归属三态: shared / legacy-agent / me→currentUser (2026-08-15 修: 之前 legacy-agent 任务保存会被洗成 currentUser)
  const owner = ownerSel && ownerSel.value === 'shared' ? 'shared'
              : ownerSel && ownerSel.value === 'legacy-agent' ? 'legacy-agent'
              : currentUser;
  // 持久化归属选择: 下次新建任务默认用上次的选择 (2026-08-11)
  try {
    localStorage.setItem('todoOwnerDefault', owner === 'shared' ? 'shared' : owner === 'legacy-agent' ? 'legacy-agent' : 'me');
  } catch(e) {}
  const content = document.getElementById('inputContent').value.trim() || title;
  const project = document.getElementById('inputProject').value.trim();
  if (creatingProject && !project) { showToast('请输入项目名'); return; }
  // 2026-08-11 定稿: 项目名不限制字符 (允许中文/空格), URL 由 URLSearchParams 自动编码
  const newProjectScope = creatingProject ? project : null;

  try {
    if (editingId) {
      const res = await fetch(`/todo/api/tasks/${encodeURIComponent(editingId)}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ title, due, due_end, due_time, color, owner, content, project }),
      });
      if (res.ok) {
        showToast('✓ 已更新');
        closeModal();
        loadTasks();
      } else {
        const data = await res.json();
        showToast('✗ ' + (data.error || '更新失败'));
      }
    } else {
      const res = await fetch('/todo/api/tasks', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ title, due, due_end, due_time, color, owner, content, project }),
      });
      if (res.ok) {
        showToast('✓ 已新建');
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        closeModal();
        if (newProjectScope) {
          currentProject = newProjectScope;
          currentTimeFilter = 'all';
          syncViewUrl('push');
        }
        loadTasks();
      } else {
        const data = await res.json();
        showToast('✗ ' + (data.error || '创建失败'));
      }
    }
  } catch (e) {
    showToast('✗ ' + e.message);
  }
}

async function deleteTask() {
  if (!editingId) return;

// Toast
function showToast(msg, duration = 2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  // 清掉上一次可能残留的「撤销」态 (2026-09-16)
  el.onclick = null;
  el.style.pointerEvents = '';
  el.style.cursor = '';
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duration);
}

// 带撤销的提示 (2026-09-16): 点 toast 本体即撤销; 默认 5s 后失效
function showUndoToast(msg, undoFn, duration = 5000) {
  const el = document.getElementById('toast');
  el.textContent = msg + '  ↺ 点此撤销';
  el.style.pointerEvents = 'auto';    // .toast 默认 pointer-events:none, 这里要可点
  el.style.cursor = 'pointer';
  el.classList.add('show');
  clearTimeout(el._timer);
  const cleanup = () => {
    el.classList.remove('show');
    el.onclick = null;
    el.style.pointerEvents = '';
    el.style.cursor = '';
  };
  el.onclick = async () => { cleanup(); await undoFn(); };
  el._timer = setTimeout(cleanup, duration);
}

// ── 自动保存 (2026-08-11): 输入内容防抖 3s 自动保存, 防长段丢失 ──
let autoSaveTimer = null;
const DRAFT_KEY = 'todoDraftContent';

// ── 内容预览/编辑双模式 (2026-08-13 方案A) ──
let contentMode = 'edit';   // 'preview' | 'edit'

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderInlineMd(s) {
  let out = escapeHtml(s);
  // **bold** → <strong>
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // `code` → <code>
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  return out;
}

function renderMarkdown(text) {
  if (!text || !text.trim()) return '<div class="md-empty">（无内容）</div>';
  const lines = text.split('\n');
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    // checkbox: - [ ] / - [x]
    let m = trimmed.match(/^[-*]\s*\[([ xX])\]\s*(.*)$/);
    if (m) {
      const checked = m[1].toLowerCase() === 'x';
      html += `<label class="md-cb${checked ? ' done' : ''}" data-line="${i}">` +
        `<input type="checkbox"${checked ? ' checked' : ''}>` +
        `<span>${renderInlineMd(m[2]) || '&nbsp;'}</span></label>`;
      continue;
    }
    // 标题
    m = trimmed.match(/^(#{1,3})\s+(.*)$/);
    if (m) {
      const lv = m[1].length;
      html += `<div class="md-h${lv}">${renderInlineMd(m[2])}</div>`;
      continue;
    }
    // 无序列表
    m = trimmed.match(/^[-*]\s+(.*)$/);
    if (m) { html += `<div class="md-li">${renderInlineMd(m[1])}</div>`; continue; }
    // 空行 → 间距
    if (!trimmed) { html += '<div class="md-space"></div>'; continue; }
    // 普通段落
    html += `<div class="md-p">${renderInlineMd(trimmed)}</div>`;
  }
  return html;
}

function setContentMode(mode) {
  contentMode = mode;
  const preview = document.getElementById('contentPreview');
  const ta = document.getElementById('inputContent');
  const btn = document.getElementById('contentModeBtn');
  if (mode === 'preview') {
    preview.innerHTML = renderMarkdown(ta.value);
    preview.hidden = false;
    ta.hidden = true;
    btn.textContent = '✏️ 编辑';
  } else {
    preview.hidden = true;
    ta.hidden = false;
    btn.textContent = '👁 预览';
    setTimeout(() => ta.focus(), 50);
  }
}

function toggleContentMode() {
  setContentMode(contentMode === 'preview' ? 'edit' : 'preview');
}

// checkbox 点击 → 翻转源 markdown 行 → 重新渲染 → 自动保存
document.getElementById('contentPreview').addEventListener('change', (e) => {
  if (!e.target.matches('input[type="checkbox"]')) return;
  const label = e.target.closest('.md-cb');
  if (!label) return;
  const lineIdx = parseInt(label.dataset.line, 10);
  const ta = document.getElementById('inputContent');
  const lines = ta.value.split('\n');
  if (lineIdx < 0 || lineIdx >= lines.length) return;
  const checked = e.target.checked;
  lines[lineIdx] = lines[lineIdx].replace(/^(\s*[-*])\s*\[[ xX]\]/, `$1 [${checked ? 'x' : ' '}]`);
  ta.value = lines.join('\n');
  // 更新预览 + 触发自动保存 (PUT content)
  setContentMode('preview');
  if (editingId) {
    clearTimeout(autoSaveTimer);
    autoSaveContent();
  }
});

function scheduleAutoSave() {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(autoSaveContent, 3000);
}

async function autoSaveContent() {
  const content = document.getElementById('inputContent').value;
  if (editingId) {
    // 编辑已有任务 → PUT content 到后端 (只存内容字段, 不触发标题改名)
    try {
      const res = await fetch(`/todo/api/tasks/${encodeURIComponent(editingId)}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ content }),
      });
      if (res.ok) showToast('✓ 已自动保存', 1200);
      else showToast('✗ 自动保存失败', 2000);
    } catch (e) {
      showToast('✗ 自动保存失败', 2000);
    }
  } else {
    // 新建任务 → 存 localStorage 草稿 (防关页面丢失)
    try {
      localStorage.setItem(DRAFT_KEY, content);
    } catch (e) {}
  }
}

async function loadGoogleCalendarStatus() {

    const res = await fetch('/todo/api/google-calendar/status');

    if (data.connected) {
      status.textContent = `✓ 已连接 ${data.calendar_name || 'TODO'} 日历`;
      connect.textContent = '重新连接 Google';
    } else {
      status.textContent = data.configured ? '未连接：将创建专用 TODO 日历' : 'OAuth 客户端凭据未配置';
      connect.textContent = '连接 Google Calendar';
    }
  } catch (e) { status.textContent = 'Google Calendar 状态读取失败'; }
}
async function startGoogleCalendarOAuth() {

// ── 持久项目 (2026-08-12: localStorage → 后端 /todo/api/persistent-projects, 跨设备同步) ──
let persistentProjectsCache = [];

function getPersistentProjects() {
  return persistentProjectsCache;
}

async function loadPersistentProjects() {
  try {
    const res = await fetch('/todo/api/persistent-projects');
    if (!res.ok) return;
    const data = await res.json();
    persistentProjectsCache = Array.isArray(data.projects) ? data.projects.filter(Boolean) : [];
    renderPersistentProjects();
    refreshProjectDatalist();
    renderProjectMenu();
  } catch (e) { /* 静默: 离线时用空列表 */ }
}

async function pushPersistentProjects() {
  try {
    await fetch('/todo/api/persistent-projects', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ projects: persistentProjectsCache }),
    });
  } catch (e) { showToast('✗ 持久项目保存失败', 2000); }
}

function addPersistentProject(name) {
  const v = name.trim();
  if (!v) return;
  if (!persistentProjectsCache.includes(v)) {
    persistentProjectsCache.push(v);
    pushPersistentProjects();
    renderPersistentProjects();
    refreshProjectDatalist();
    renderProjectMenu();
    showToast('✓ 已设为持久项目');
  }
}
function removePersistentProject(name) {
  persistentProjectsCache = persistentProjectsCache.filter(p => p !== name);
  pushPersistentProjects();
  renderPersistentProjects();
  refreshProjectDatalist();
  renderProjectMenu();
  showToast('已移除持久项目');
}
function renderPersistentProjects() {
  const list = getPersistentProjects();
  const container = document.getElementById('persistentProjectList');
  container.replaceChildren();
  if (!list.length) {
    const empty = document.createElement('p');
    empty.className = 'settings-hint';
    empty.textContent = '（暂无持久项目）';
    container.appendChild(empty);
    return;
  }
  for (const name of list) {
    const row = document.createElement('div');
    row.className = 'persistent-project-item';
    const label = document.createElement('span');
    label.className = 'persistent-project-name';
    label.innerHTML = '<span class="y8i y8i-bookmark"></span> ' + escapeHtml(name);
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'btn btn-cancel persistent-project-remove';
    remove.textContent = '移除';
    remove.addEventListener('click', () => removePersistentProject(name));
    row.append(label, remove);
    container.appendChild(row);
  }
  // datalist 候选项 = 所有已知项目（含完成的），方便输入
  const dl = document.getElementById('persistentProjectOptions');
  dl.innerHTML = '';
  const known = new Set([...allTasks, ...completedTasks].map(t => t.project).filter(Boolean));
  for (const name of known) {
    const opt = document.createElement('option');
    opt.value = name;
    dl.appendChild(opt);
  }
}

  document.getElementById('persistentProjectInput').value = '';

  if (e.isComposing || e.keyCode === 229) return; // IME 组词回车=确认候选词,不提交

});

function applyTheme(mode) {

  document.dispatchEvent(new CustomEvent('y8y-theme-changed', { detail: { mode } }));

function initTheme() {
  if (window.darklight) { darklight.prePaint(); return; }
  let mode = null;
  try { mode = localStorage.getItem('y8y-theme-mode'); } catch(e) {}
  if (mode !== 'light' && mode !== 'dark') {
    mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', mode);
}
